[server]
# This repository contains a large corpus and many experiment artifacts.
# Restart the small demo explicitly instead of watching the repository tree.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#16786f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f8"
textColor = "#243449"
