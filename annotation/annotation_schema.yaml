# =============================================================================
# ANNOTATION SCHEMA — one file per document, named <case_id>.yaml
# Companion to annotation/annotation_guide.txt. Section refs below point into it.
#
# Every key maps to exactly one construct in ontology/echr.ttl (v3.5.0).
# annotation/evaluated_triples.yaml lists which of them are scored, and how.
#
# Conventions
#   - Omit a key entirely when the document gives you nothing (§7).
#   - Write "Unknown" only where the vocabulary has that escape value (§7).
#   - Controlled vocabularies are CLOSED: use the short forms in §6, never prose.
#   - Dates are QUOTED strings, as precise as the text allows (§5):
#       "2004-03-14" | "2004-03" | "2004".  Always quote -- unquoted, YAML
#       reads these as three different types.
#   - Quotes are copy-pasted verbatim, never retyped (§5).
# =============================================================================

case_id: "001-188177"        # HUDOC id, matches the filename
annotator: "david"
annotated_utc: "2026-09-05T10:00:00Z"
mode: cold                   # cold | assisted -- all 20 calibration docs are cold
guide_version: "1.0"         # bump if annotation_guide.txt changes mid-set

proceedings:

  # ---------------------------------------------------------------------------
  # Worked example 1 — a prosecutor's decision. Illustrates: investigative level,
  # an event with one party, a chain head (follows: null).
  # ---------------------------------------------------------------------------
  - id: 1                            # local, 1..n, ordered by decision_date
    type: ProsecutorialReview        # §6.5   E a echr:<Class>
    body: "the Sofia District Prosecutor's Office"
                                     #        E echr:hasCourt A .
                                     #        A echr:hasAuthorityName "..."
    authority_kind: Prosecutorial    # §6.6   A echr:hasAuthorityKind ...
    jurisdiction_state: "Bulgaria"   #        A echr:hasJurisdictionState "..."
                                     #        the respondent State, almost always
                                     #        (§5.2) -- free text, not a closed
                                     #        vocabulary, same as hasNationality
    start_date: "2005-02-01"          #        E echr:hasProceedingStartDate
    decision_date: "2005-03-14"       #        E echr:hasDecisionDate
    level: Investigative             # §6.1   E echr:hasInstanceLevel
    proceeding_type: Criminal        # §6.2   E echr:hasProceedingType
    outcome: Inadmissible            # §6.3   E echr:hasOutcome
    outcome_direction: UnfavourableToApplicant
                                     # §6.4   E echr:hasOutcomeDirection
    parties:                         #        one entry per party per event (§5)
      - name: "the applicant"        #        P echr:hasPartyName / hasPersonName
        side: Initiating             # §6.7   p echr:hasPartySide echr:Side...
        natural_person: true         #        P a echr:NaturalPerson
    follows: null                    #        E echr:followsProceeding E'
                                     #        null = head of a chain. Not
                                     #        FunctionalProperty in the ontology --
                                     #        give a list [n, m] where one decision
                                     #        disposes of more than one predecessor
                                     #        (worked example 7).
    quote: "On 14 March 2005 the Sofia District Prosecutor's Office refused to
      open a criminal investigation into the applicant's complaint."
                                     #        E echr:hasSupportingQuote                         #        not a triple -- audit locator
    note: "Keeps BOTH dates because the complaint of 1 Feb is reported, not
      narrated -- there is no separate sentence to quote for it, so there is
      only one act to record. Contrast worked example 5 (§3.1)."

  # ---------------------------------------------------------------------------
  # Worked example 2 — the court challenge to event 1. Illustrates: `follows`,
  # two-sided participation, the deciding body kept OUT of the party list.
  # ---------------------------------------------------------------------------
  - id: 2
    type: DomesticProceeding
    body: "the Sofia City Court"
    authority_kind: Judicial
    jurisdiction_state: "Bulgaria"
    start_date: "2005-04-02"
    decision_date: "2005-11-20"
    level: FirstInstance
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
      - name: "the Sofia District Prosecutor's Office"
        side: Responding             # the prosecutor decided event 1 and is a
        natural_person: false        # PARTY to event 2 -- legitimate (§5)
    follows: 1
    quote: "The applicant appealed against that refusal to the Sofia City Court,
      which upheld it on 20 November 2005."
    note: ""

  # ---------------------------------------------------------------------------
  # Worked example 3 — minimal record. Everything the text does not give is
  # omitted or Unknown; nothing is inferred from knowledge of the system (§7).
  # ---------------------------------------------------------------------------
  - id: 3
    type: DomesticProceeding
    body: "the Supreme Court of Cassation"
    authority_kind: Judicial
    jurisdiction_state: "Bulgaria"
    decision_date: "2007"
    level: Cassation
    proceeding_type: Criminal
    outcome: Unknown
    outcome_direction: Unknown
    parties: []                      # empty list = the text names no party.
                                     # Omitting the key means the same thing;
                                     # the empty list says you checked.
    follows: 2
    final_domestic_decision: true    # E echr:isFinalDomesticDecision true
                                     # write ONLY on the terminal event of each
                                     # chain; omit elsewhere (§5). Follow the
                                     # `follows` chain to its end -- not the
                                     # latest date.
    quote: "The case reached the Supreme Court of Cassation in 2007."
    note: "Text gives no outcome and no month."

  # ---------------------------------------------------------------------------
  # Worked example 4 — a borderline event (§4.4). Recorded, flagged, moved on.
  # No rule was invented and no time was spent agonising.
  # ---------------------------------------------------------------------------
  - id: 4
    type: ProsecutorialReview
    body: "the investigator"
    authority_kind: Prosecutorial
    jurisdiction_state: "Bulgaria"
    decision_date: "2005-01-20"
    level: Investigative
    proceeding_type: Criminal
    outcome: Unknown
    outcome_direction: Unknown
    parties: []
    follows: null
    borderline: true                 # §4.4 -- membership genuinely contestable
    borderline_reason: "crime-scene inspection; no decision by any body, so it
      may not be a milestone in the procedural history at all"
    quote: "On 20 January 2005 an investigator inspected the scene."
    note: ""

  # ---------------------------------------------------------------------------
  # Worked examples 5 and 6 — A FILING AND ITS DECISION, SPLIT (§3.1).
  # The judgment narrates the institution and the judgment as two separate
  # sentences, so they are two events. This is the NORMAL case; a record with
  # both dates (example 1) is the exception.
  #
  # The filing half carries start_date and no decision_date; the decision half
  # carries decision_date and no start_date. Everything that followed the
  # proceeding -- appeals, enforcement -- follows the DECISION half.
  # ---------------------------------------------------------------------------
  - id: 5
    type: DomesticProceeding
    body: "the Celje District Court"
    authority_kind: Judicial
    jurisdiction_state: "Slovenia"
    start_date: "1999-03-15"         # no decision_date on a filing event
    level: FirstInstance
    proceeding_type: Civil
    outcome: Unknown                 # not "pending" -- the outcome simply
    outcome_direction: Unknown       # belongs to the other half, id 6
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
    follows: null
    quote: "On 15 March 1999 the applicant instituted civil proceedings against
      his employer in the Celje District Court seeking damages."
    note: "Filing half of a §3.1 pair; the decision is id 6."

  - id: 6
    type: DomesticProceeding
    body: "the Celje District Court"   # same body, level, type as id 5
    authority_kind: Judicial
    jurisdiction_state: "Slovenia"
    decision_date: "2003-06-05"        # no start_date on a decision event
    level: FirstInstance
    proceeding_type: Civil
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
    follows: 5                         # the decision follows its own filing
    quote: "On 5 June 2003 the court dismissed the claim."
    note: "Decision half of a §3.1 pair. Note the four-year gap is irrelevant to
      the split -- what matters is that the text narrates both acts."

  # ---------------------------------------------------------------------------
  # Worked example 7 — ONE decision disposing of TWO predecessors. Illustrates:
  # `follows` as a list. echr:followsProceeding is not owl:FunctionalProperty,
  # so an event may follow more than one predecessor where the text supports it.
  # ---------------------------------------------------------------------------
  - id: 7
    type: DomesticProceeding
    body: "the Regional Court"
    authority_kind: Judicial
    jurisdiction_state: "Austria"
    decision_date: "1996-08-29"
    level: Appeal
    proceeding_type: Civil
    outcome: Remitted
    outcome_direction: Mixed
    parties:
      - name: "the first applicant"
        side: Initiating
        natural_person: true
      - name: "the mother"
        side: Initiating
        natural_person: true
    follows: [3, 6]                  # two prior events resolved by one decision
    quote: "The Regional Court granted an appeal by the first applicant against
      the transfer of jurisdiction and, on the mother's appeal, quashed the
      District Court's enforcement order and referred the case back to it."
    note: "ONE decision disposing of TWO appeals -- the first applicant's against
      the transfer (id 3) and the mother's against the enforcement order (id 6).
      Do not force this onto a single id or split the decision into two events
      to work around it -- a list is the correct representation."

  # ---------------------------------------------------------------------------
  # Worked example 8 — a THIRD-STATE authority. Illustrates: `jurisdiction_state`
  # naming a state other than the respondent, and why `final_domestic_decision`
  # can never land here even though nothing else in this chain postdates it.
  # ---------------------------------------------------------------------------
  - id: 8
    type: DomesticProceeding
    body: "the Oakland Circuit Court"
    authority_kind: Judicial
    jurisdiction_state: "the United States"
    decision_date: "1996-04-16"
    level: FirstInstance
    proceeding_type: Civil
    outcome: MeritsDecided
    outcome_direction: FavourableToApplicant
    parties:
      - name: "the first applicant"
        side: Initiating
        natural_person: true
    follows: 7
    borderline: true
    borderline_reason: "a UNITED STATES court -- narrated as part of this history
      but not a proceeding of the respondent State, so arguably not 'domestic'"
    quote: "By a decision of 16 April 1996, the court pronounced a default judgment of divorce."
    note: "NO final_domestic_decision here, however terminal within its own
      narrative -- Article 35 exhaustion runs on the respondent State's own
      courts (§5.1). `jurisdiction_state` is what makes that a checkable fact
      rather than something inferred from `body` or the borderline note alone."

# =============================================================================
# Document-level notes: anything about the judgment as a whole -- an unusual
# structure, a section you judged out of scope, a chain you could not resolve.
# Read during disagreement analysis, so write what a reader would need.
# =============================================================================
document_note: >
  Two unconnected chains: the criminal complaint (events 1-3) and the unrelated
  civil compensation claim (events 4-6). No procedural link between them in the
  text, so no `follows` crosses.
