document_note: >
  THE DETENTION QUESTION DOMINATES THIS DOCUMENT. Eleven separate judicial
  decisions extend, refuse or restore the applicant's pre-trial detention between
  Aug 2001 and May 2004 (ids 4, 5, 9-16), each on a fresh application. They are
  recorded as separate events on the guide's rule that the ORDER imposing detention
  is an event while the period itself is echr:PreTrialDetention and out of scope. If
  detention decisions inside a running prosecution are instead steps, this document
  drops from 25 events to about 12 -- the single largest count swing in the sample.

  SPLIT UNDER §3.1: three pairs are now two events each -- the five judges'
  application for extraordinary review (14 -> 15), the SIZO administration's
  request that the applicant's release be considered (21 -> 22) and the medical-care
  claim in the Shevchenkivskyy District Court (23 -> 24). The detention decisions
  themselves are NOT split: the text gives each as a single ruling, without
  separately dating the application that prompted it.

  id 21 is worth attention: the request goes to the INVESTIGATOR while the reply
  (id 22) comes from the Prosecutor of the Obolonskiy District, so one §3.1 pair
  spans two authorities. §8 matches events on authority. Flagged REVIEW, as is the
  parallel case at 001-177299 id 12.

  id 25 KEEPS BOTH DATES: "Between 2005 and 2007 the applicant instituted
  proceedings against the judges of the Court of Appeal" is an undifferentiated
  summary of several sets of proceedings over two years, with no distinct filing or
  decision to separate. §3.1 does not reach it.

  RECORDS ARE NOT IN STRICT DATE ORDER, and were not before this revision: id 17
  (19 May 2004) sits after id 16 (24 May 2004), and ids 21-22 (Feb 2004) sit after
  id 20 (2007). The annotator grouped by topic rather than by date. Guide §5.1 asks
  for chronological order; re-sorting was left alone here so the revision stays a
  §3.1 change only. REVIEW.

  Ids were renumbered and do NOT correspond to the pre-v1.1 numbering.
