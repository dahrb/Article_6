document_note: >
  TWO independent chains over the same plot of land, running in parallel for nine
  years: Mrs F.'s claim against the applicants (ids 1, 3-11, three full first
  instance / appeal / cassation cycles with two remittals) and the applicants'
  counter-claim against her (ids 2 and 12, settled). Each has its own
  `follows: null` head and its own terminal decision. The suspensions of chain B
  pending chain A (¶11) are InactivityPeriod, outside this annotation; the roughly
  thirty adjournments and the five forensic examinations are steps inside
  proceedings (guide §3).

  SPLIT UNDER §3.1: both chain heads are now two events -- Mrs F.'s claim (1 -> 3)
  and the applicants' claim (2 -> 12). Nothing else splits: the text never dates a
  single appeal or cassation petition, and the two fresh considerations are
  instituted by remittals rather than by filings. This makes the two filing events
  the heads of their chains and pushes the chain-B pair nine years apart. Ids were
  renumbered chronologically and do NOT correspond to the pre-v1.1 numbering.
