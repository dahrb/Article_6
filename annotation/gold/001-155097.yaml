      rule: the applicant's request to the mayor ('On an unspecified date after
      that the applicant requested the Bankya district mayor to issue these
      documents') and the years of instructions to submit further papers. No
      dates anywhere, which is why nothing here can be a dated event -- and why
      it is this record that id 5 challenges."

