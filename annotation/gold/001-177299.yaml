document_note: >
  TWO independent chains, each with its own terminal decision. Chain 1 (ids 1-4,
  6-11) is the security-clearance revocation, running from the Authority through
  internal appeal to judicial review, cassation and the Constitutional Court --
  most of its early events are AdministrativeAction rather than DomesticProceeding,
  which is unusual and worth checking. Chain 2 (ids 12-14) is the later criminal
  prosecution, which the judgment narrates without linking it to the clearance
  decision.

  id 5 (removal from office) is flagged and sits outside both chains.

  SPLIT UNDER §3.1: five pairs are now two events each -- the clearance request
  (1 -> 2), the security investigation (3 -> 4), the judicial review (7 -> 8), the
  constitutional complaint (10 -> 11) and the criminal prosecution (12 -> 13). This
  is the highest split rate in the sample, because the judgment consistently dates
  both the application and the ruling on it.

  TWO THINGS §3.1 RAISES HERE. First, id 3: the security investigation is opened by
  the Authority of its own motion, not on anyone's application -- flagged REVIEW,
  because "institution" may not be the right reading of an own-motion opening.
  Second, id 12: the filing half is the prosecution service's indictment while the
  decision half is the Regional Court's judgment, so one proceeding is split across
  two different authorities. §8 matches events on authority, and the guide should
  say which body the filing half takes. Ids were renumbered chronologically and do
  NOT correspond to the pre-v1.1 numbering.
