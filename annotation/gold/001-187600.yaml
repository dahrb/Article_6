document_note: >
  One chain: a final judgment in the applicants' favour, reopened years later on
  the prosecutor's out-of-time appeal and quashed. The two execution mentions
  (¶7 and ¶11) are the annotation question in this document -- both are hedged or
  bare, and whether they are EnforcementAction events or background is exactly the
  boundary guide §4.4 asks to be flagged rather than settled.

  SPLIT UNDER §3.1: the prosecutor's time-limit application (3 -> 4) is now two
  events. Nothing else here splits: the 2010 claim is instituted on an unstated
  date (¶6), and the prosecutor's two later appeals are narrated but undated, which
  §3.1 excludes. Ids 4 and 5 shifted to 5 and 6; the numbering does NOT correspond
  to the pre-v1.1 version.
