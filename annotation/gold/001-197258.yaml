        natural_person: true
    follows: 4
    quote: "On 10 November 2006 the Supreme Court, acting in accordance with the provisions of the Code of Administrative Procedure, referred the case for examination to the Higher Administrative Court."
    note: "A transfer of the cassation appeal to another court. Nothing was granted
      or denied, so outcome_direction stays Unknown (§6.4) and `matter` is omitted:
      a transfer of jurisdiction has no substantive matter of its own (§5.1)."

  - id: 6
    type: DomesticProceeding
    body: "the Higher Administrative Court"
    authority_kind: Judicial
    jurisdiction_state: "Ukraine"
    decision_date: "2007-11-01"
    level: Cassation
    proceeding_type: Civil
    outcome: Inadmissible
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the first applicant"
        side: Initiating
        natural_person: true
    follows: 5
    quote: "On 1 November 2007 the Higher Administrative Court rendered a ruling refusing to examine the cassation appeal on the basis that it had been lodged on 6 July 2004 and thus outside the statutory time-limit."
    note: "Inadmissible: refused on a time-limit without reaching the Chernobyl
      claim. `matter` omitted for the same reason -- the ruling is about the
      admissibility of the appeal, not about the pension or the damages. The 6
      July date it relies on is the first-instance court registry's stamp on the
      cassation appeal (the letter itself was delivered on 5 July and signed for
      by 'a certain E.'); not given its own record since no body decided
      anything by stamping it, but it is the sole fact this ruling turns on."

  - id: 7
    type: DomesticProceeding
