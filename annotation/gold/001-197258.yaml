    follows: 1
    matter: [Pension, Damages]
    quote: "On 3 June 2004 the Court of Appeal of the Odessa Region upheld the decision of the first-instance court."
    note: "The lodging of this appeal is never narrated, so no §3.1 split.
      `follows: 1`, the head of the first-instance proceeding, not id 2 (§5.4)."

  - id: 4
    type: DomesticProceeding
    body: "the Suvorovskyy District Court of Odessa"
    authority_kind: Judicial
    jurisdiction_state: "Ukraine"
    start_date: "2004-07-02"
    level: Cassation
    proceeding_type: Civil
    outcome: Unknown
    outcome_direction: Unknown
    parties:
      - name: "the first applicant"
        side: Initiating
        natural_person: true
    follows: 3
    matter: [Pension, Damages]
    quote: "On 2 July 2004 the first applicant sent an appeal in cassation by registered mail to the Suvorovskyy District Court of Odessa, in accordance with the legal procedure provided for by Article 323 of the Code of Civil Procedure, pursuant to which a cassation appeal was to be lodged with the court of first instance that had considered the case."
    note: "Heads the cassation proceeding. `body` is the District Court because
      that is the authority this passage names as receiving the appeal -- domestic
      procedure required cassation appeals to be filed there. NOT the head of a
      §3.2 group with ids 5 and 6: those were decided by different authorities
      (the Supreme Court and the Higher Administrative Court), which §3.2 says
      cannot be acts of the same proceeding, so they are linked by `follows`
      instead. Which date this appeal counts as lodged on -- 2, 5 or 6 July -- is
      the whole dispute in the case; start_date takes the date of the act this
      sentence narrates."

  - id: 5
    type: DomesticProceeding
    body: "the Supreme Court"
    authority_kind: Judicial
    jurisdiction_state: "Ukraine"
    decision_date: "2006-11-10"
    level: Cassation
