        natural_person: true
    follows: 6
    final_domestic_decision: true
    quote: "On 26 December 2007 the Supreme Court of Ukraine refused to reopen the proceedings."
    note: "The first applicant's appeal to this court is narrated (¶14, 'The first
      applicant appealed to the Supreme Court, asking it to quash the decision of
      the Higher Administrative Court') but carries no date, so under §3.1 it stays
      inside this record rather than becoming a filing event of its own. Level
      Reopening because the request the court refused was to reopen. Outcome
      MeritsDecided: it decided the reopening request, though the text gives no
      reasons -- Inadmissible would be the alternative reading. Terminal event of
      the single chain."

