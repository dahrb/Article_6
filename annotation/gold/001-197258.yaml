        natural_person: true
    follows: null
    matter: [Pension, Damages]
    quote: "In June 2002 the first applicant lodged a claim with the national courts seeking payment, under the Status and Social Protection of Chernobyl Victims Act, of his annual health-improvement lump sum (five minimum wages)."
    note: "Filing half of a §3.1 pair; the decision is id 2, part_of: 1. This
      passage says only 'the national courts'; `body` is written as the court
      named in id 2, because §3.2 requires the two acts of one proceeding to
      agree on it and the narrative leaves no doubt which court received the
      claim. The claim also covered the second applicant's Chernobyl allowance
      and non-pecuniary damage for both, but the text shows only the first
      applicant lodging it, so he is the only party recorded."

