document_note: >
  A long, branching prosecution of a serving court president. THREE prosecutions
  converge (bribery from G., abuse of power re Ga., bribes from R. -- ids 1, 5, 6,
  merged at id 7), a SECOND prosecution for obstructing court orders (id 11), a
  parallel strand of attempts to remove him from office (ids 8, 12), and six
  detention decisions (ids 15-21).

  NO EVENT IS MARKED final_domestic_decision: the conviction was quashed in 2014
  and the investigation was still pending in March 2019.

  Two known undercounts, both stated in the text but not specified: the
  "subsequent extensions" of detention between June 2009 and February 2010 (id 21),
  and the challenges to the institution of proceedings (id 24). The applicant's
  complaints about his transport and detention conditions (¶41) are described in
  ¶78-88, outside the range read for this draft -- CHECK THAT SECTION for a further
  chain.

  SPLIT UNDER §3.1: one pair is now two events -- the prosecutors' request that the
  President of the Supreme Court support the arrest application (id 13) and his
  endorsement of it (id 14). Nothing else in this document narrates a dated filing
  separately from its decision. Ids 14-24 shifted to 15-25; the numbering does NOT
  correspond to the pre-v1.1 version.
