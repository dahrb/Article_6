document_note: >
  A criminal investigation and trial arising from four searches conducted on
  3 July 2007. The investigative events (ids 1-8) are dense and near-simultaneous;
  the trial chain (ids 9-11) is straightforward.

  SPLIT UNDER §3.1: two pairs are now two events each -- the prosecutor's
  validation request and the court's ruling on it (5 -> 6), and defence counsel's
  request for the video recordings and the investigator's refusal (7 -> 8). The
  first pair is worth noting: filing and decision fall on the SAME DATE, 4 July
  2007. §3.1 splits on whether the text narrates both acts, not on the length of
  the interval, and here each act has its own sentence and its own actor. Ids 7-9
  shifted to 9-11; the numbering does NOT correspond to the pre-v1.1 version.
