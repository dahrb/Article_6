document_note: >
  A criminal case running from the FSB investigation of 2000 through two
  remittals, an acquittal by jury, its quashing, and a retrial ending in
  conviction. One linear chain.

  SPLIT UNDER §3.1: two pairs are now two events each -- the first jury trial
  (9 -> 10) and the retrial (12 -> 13). Both are unusual in that the institution is
  the COURT's own dated act (deciding to empanel a jury; initiating jury selection)
  rather than a party's application, the same pattern as 001-177299 id 3. Flagged
  REVIEW on both.

  A START_DATE WAS ALSO REMOVED at id 2. The pre-v1.1 record carried start_date
  2002-01-24, but that date belongs to the applicant's request to admit the
  scientists' opinions (¶15), a step inside the proceeding, while the application
  the court granted on 6 Feb 2002 was the PROSECUTOR's request for remittal (¶16),
  which the text never dates. That is a conflation rather than a folding, and
  fixing it means id 2 now carries a decision_date only.

  Ids were renumbered chronologically and do NOT correspond to the pre-v1.1
  numbering.
