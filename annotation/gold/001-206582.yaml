# SCOPE: two categories of event are deliberately not annotated. (1) The
# Evaluation Committee's own assessment process -- the call for applications
# and its ranking of the thirty-three candidates -- is recruitment background
# that the Minister's proposal (id 1) then departed from; it is never itself
# challenged in court. (2) The parliamentary motion of no confidence against
# the Minister and A.E.'s later, regular re-appointment to the same post are
# also excluded: the former is a political vote rather than a legal
# determination, and the latter is disconnected from every litigated thread in
# this file. Ids were renumbered and do NOT correspond to the pre-v1.1
# numbering, nor to the numbering before these events were removed from scope.

