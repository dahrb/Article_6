    jurisdiction_state: "Iceland"
    decision_date: "2017-05-29"
    level: AdministrativeReview
    proceeding_type: Administrative
    outcome: MeritsDecided
    outcome_direction: Unknown
    parties: []
    follows: null
    quote: "In a letter dated 29 May 2017, the Minister of Justice presented to the Speaker of Parliament her proposal of fifteen candidates for appointment as Court of Appeal judges. The proposal contained only eleven of the fifteen candidates whom the Evaluation Committee had found to be the most qualified for the post of judge at the Court of Appeal."
    note: "`follows: null`: this is the first event in scope (see SCOPE note above).
      The Evaluation Committee's own assessment process -- the call for applications
      and the Committee's ranking of the thirty-three candidates -- is the
      recruitment background the Minister then departed from, not itself a
      procedural step or something any court reviewed; what is under challenge is
      the departure. The Minister's proposal excluded four candidates the Committee
      had ranked among the fifteen most qualified and substituted four others,
      including A.E. (ranked 18th), who later sat on the applicant's own appeal
      (id 14). The decision the Supreme Court held unlawful at id 10."

