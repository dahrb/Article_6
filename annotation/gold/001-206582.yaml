document_note: >
  FIVE NARRATIVE THREADS, but only TWO weakly-connected components in the
  `followsProceeding` graph. The appointment process (A, ids 1-7), the excluded
  candidates' proceedings (B, ids 8-12), the parallel compensation claims (D, ids
  21-24) and the parliamentary and remedial aftermath (E, ids 25-28) all root back
  to id 7 -- each of B, D and E is a court or parliamentary challenge to that same
  appointment decision, so guide §3's rule ("an administrative decision and the
  court challenge to it are TWO events, linked by `follows`") applies to all
  three, not just B. Component two is chain C (ids 13-20), the applicant's own,
  entirely unrelated criminal prosecution -- the only event in this document with
  no connection to the appointment saga at all.

  The applicant is a party to only one thread (C). The rest are narrated as this
  case's history and are in scope under guide §4.3, which is the clearest
  illustration in the sample of why that rule matters. Without chain A there is
  nothing for the applicant's complaint to attach to, and without chain B the
  Supreme Court's finding of unlawfulness
  (id 12) is invisible.

  SPLIT UNDER §3.1: seven pairs are now two events each -- the CSC's consideration
  (4 -> 5), the excluded candidates' appeal (11 -> 12), the applicant's own appeal
  (15 -> 16), his appeal to the Supreme Court (19 -> 20), the E.J./J.H. proceedings
  (21 -> 22), the no-confidence motion (25 -> 26) and A.E.'s re-appointment
  (27 -> 28). This is the largest number of splits in the sample. Two further
  records were ALREADY filing-shaped before this revision and are untouched: ids 9
  and 24, both appeals still pending when the Court gave judgment.

  THREE §3.1 PROBLEM CASES, all flagged REVIEW in their notes. id 15: the appeal was
  lodged with the Supreme Court but decided by the Court of Appeal after the case
  was transferred, so one proceeding spans two authorities and the filing half has
  no body of its own to name. id 19: the sentence carries two dates -- leave granted
  17 Apr 2018, appeal lodged 20 Apr -- and the earlier is recorded. id 21: the text
  gives only a range, "In February and March 2017", for two separate actions.

  RECORDS ARE GROUPED BY CHAIN, NOT BY DATE, and were before this revision too --
  chain C opens in Jan 2017, after chain B has run to Dec 2017. Guide §5.1 asks for
  chronological order; re-sorting would interleave five chains and destroy the
  grouping, so it was left alone. REVIEW.

  Ids were renumbered and do NOT correspond to the pre-v1.1 numbering.
