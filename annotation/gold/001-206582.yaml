subject_matter:
  - "procedural irregularities in the appointment of new Court of Appeal judges, including the Minister's unexplained departure from an expert evaluation"
  - "whether a tribunal that included an irregularly appointed judge was a 'tribunal established by law'"
  - "the applicant's own, unrelated conviction for driving offences, decided at appeal by the irregularly appointed judge"
