document_note: >
  NOT RECORDED: the wrongful removal of 30 Oct 1995 (¶12), by which the mother took
  the child to Austria without the father's consent. It is legally decisive -- the
  Graz District Civil Court found it a wrongful removal within the meaning of
  Article 3 of the Hague Convention, and the return order rests on that finding --
  but no echr:DomesticEvent subclass fits a private act by a private person, so it
  is left out rather than forced into a type. Worth reporting as an ontology
  limitation: the operative fact of a child-abduction case cannot be expressed.

  The most tangled document in the sample: THREE Austrian chains -- the Hague
  Convention return order (1, 3-5), its enforcement (6, 8, 9, 10, 12-15, 17-19,
  two full cycles through district, regional and Supreme Court), and custody
  (2, 20, 21) -- plus three UNITED STATES decisions (7, 11, 16).

  SPLIT UNDER §3.1: four filing/decision pairs are now two events each -- the
  return request (1 -> 3), the first enforcement application (6 -> 8), the second
  enforcement application (12 -> 17) and the custody claim (2 -> 20). Every other
  record here narrates only one act. Ids were renumbered chronologically, so they
  do NOT correspond to the pre-v1.1 numbering.

  A FIFTH FILING WAS ADDED (id 10): the mother's appeal against the enforcement
  order of 8 May 1996 (¶25), previously left unrecorded and only referenced in
  notes as a gap. Adding it resolves two edges that were previously mis-pointed:
  id 13 (the transfer of jurisdiction, made "at the request of the second
  applicant's mother") now follows id 10 instead of jumping back to id 8, and
  id 14 (the appeal decision disposing of both the first applicant's and the
  mother's appeals) now follows id 10 instead of id 8 for the same reason. The
  renewed custody application bundled into the same sentence is still not
  separately modelled -- it continues the already-open id 2/id 20 proceeding.

  THE BIG QUESTION HERE IS ids 7, 11, 16. The respondent State is Austria, so the
  Michigan divorce, the federal arrest warrant and the "safe harbour" order are
  proceedings of a third State. They are unquestionably narrated as part of this
  history, which guide §4.3 puts in scope, but "domestic" naturally means the
  respondent State's own courts. Deciding this changes the event count by 3 of 21,
  and the same question will recur in any extradition or child-abduction case.
  Whatever you decide, it should go into the guide rather than stay a per-document
  call.

  A SECOND QUESTION §3.1 RAISES: the filing half of a pair often does not name the
  deciding body (ids 6, 10, 12) or names it differently from the decision half
  (id 1, "the Austrian courts" vs "the Graz District Civil Court"). §5.2 says to
  write the authority VERBATIM as the passage gives it, but §8 matches events on
  authority. Ids 1, 6, 10 and 12 are flagged REVIEW for this. The guide should say
  whether the filing half may borrow the body named at the decision.

  Also note id 14: one decision disposing of two separate appeals, which `follows`
  cannot represent -- resolved to follow id 10, the specific dated filing on the
  mother's side, though the first applicant's own appeal against id 13 remains
  undated and unrecorded; and id 17, where the §3.1 edge to its filing (id 12)
  competes with the remittal edge to the cassation at id 15. The Central Authority
  correspondence (¶31) is diplomatic exchange, not a proceeding.
