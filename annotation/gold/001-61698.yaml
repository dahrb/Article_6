  - id: 1
    type: AdministrativeAction
    body: "the Deputy Governor of Diyarbakır"
    authority_kind: Administrative
    jurisdiction_state: "Turkey"
    decision_date: "1994-08-27"
    level: AdministrativeReview
    proceeding_type: Administrative
    outcome: Other
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "Meliha Dal"
        side: Initiating
        natural_person: true
    follows: null
    borderline: true
    borderline_reason: "the Deputy Governor's oral answer is not narrated as a
      decision, and the date is given only as 'on or around' 27 August 1994"
    matter: Investigation
    quote: "On or around 27 August 1994, Mehmet Salim's sister Meliha Dal personally handed a petition about her brother's disappearance to the Deputy Governor of Diyarbakır. After reading the petition and, in her presence, speaking on the telephone with Ahmet Korkmaz, a non-commissioned officer (NCO) of the gendarmerie, the Deputy Governor told her that Mehmet Salim was in the hands of the State and that there was nothing that she could do for the time being."
    note: "The first approach to any authority. decision_date is written as
      the exact day the text hedges ('On or around 27 August 1994'); §5.1 has
      no way to record the hedge, so it is flagged here and by the borderline
      flag. This account is the applicant's alone and the Court did not
      establish it."

  - id: 2
    type: ProsecutorialReview
    body: "the Bismil public prosecutor"
    authority_kind: Prosecutorial
    jurisdiction_state: "Turkey"
    start_date: "1994-08-29"
    level: Investigative
    proceeding_type: Criminal
    outcome: Unknown
    outcome_direction: Unknown
    parties:
      - name: "Hüsna Acar"
        side: Initiating
        natural_person: true
    follows: null
    matter: Investigation
    quote: "On 29 August 1994 Hüsna Acar filed a petition with the public prosecutor's office in Bismil requesting an investigation into the disappearance of her son Mehmet Salih Acar, who had been abducted ten days before by two unknown persons – armed with Kalashnikov rifles and wearing civilian clothes – in a taxi. In her petition Hüsna Acar further stated that her family had already made enquiries with the gendarmerie and the police, who had told them that they knew nothing about it. Hüsna Acar requested the public prosecutor to issue the necessary instructions in order to find her son as soon as possible."
    note: "HEAD OF THE BISMIL PRELIMINARY INVESTIGATION -- registered under
      no. 1994/445 (see id 19) and the spine of this document. Ids 3, 5, 7,
      11, 12, 13, 14, 18, 19 and 20 are all acts of it under
      §3.2, and each writes `body` as it is written here so the group agrees.
      Acts by OTHER authorities inside the same undecided
      investigation -- the gendarmerie, the Ankara prosecutor, Dikmen police
      station -- take `occurs_during: 2` instead (§5.4). The judgment narrates
      this history three times over (the applicant's account, the
      Government's, and the documents produced); under §8 the repeated
      mentions are the same events, and each record quotes the fullest
      passage."

