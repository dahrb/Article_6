    quote: "In a decision of 10 May 1999 the urgent applications judge of the Paris Administrative Court made a first interim award of FRF 250,000 (EUR 38,112.25) and appointed an expert."
    note: "An interim award is itself a domestic legal event. The request that
      opened it (“At the same time the applicants submitted to the urgent
      applications judge at the same court a request for the appointment of an
      expert and an interim award”, 29 Mar 1999) is not narrated as a separate
      filing event -- it is folded in here as a step, matching how the main
      claim's own procedural steps (memorials, replies) are treated. `follows`
      is null rather than 3: id 3 (the main claim) is not decided until id 7,
      years later, so this decision did not come AFTER id 3 -- it happened
      WHILE id 3 was still pending. `occurs_during: 3` records that containment
      instead of straining `follows` to mean something it doesn't (see id 2 of
      001-5878 and prompt_tweaks.md §6 for the same pattern; EXPERIMENTAL
      FIELD, not yet in the ontology or guide). FRF 250,000. The expert
      reported on 16 Jul 1999 -- evidence, not an event."

