document_note: >
  One chain over a medical-negligence compensation claim. NO EVENT IS MARKED
  final_domestic_decision: the appeal (id 9) was still pending when the Court gave
  judgment, and guide §5 says a chain still pending at the time of the application
  has no flag.

  SPLIT UNDER §3.1: three filing/decision pairs are now two events each -- the
  preliminary claim to AP-HP (1 -> 2), the main claim to the Paris Administrative
  Court (3 -> 8) and the interim-award request (4 -> 5). The second interim award
  (id 6) is NOT split: the renewed request is narrated but undated. Ids were
  renumbered chronologically and do NOT correspond to the pre-v1.1 numbering.

  Four of nine events are flagged, which is high and worth your attention -- they
  are all the same question in different clothes: whether interlocutory decisions
  (two interim awards, one advisory opinion) are events or steps inside the main
  claim. If they are steps, this document has four events, not nine. The medical
  acts (the amniocentesis of 20 Aug 1996, the misdiagnosis) are treatment, not
  procedure, and are not recorded.
