        side: Responding
        natural_person: true
    final_domestic_decision: true
    matter: Charge
    quote: "On 26 April 1999 the Court of Appeal dismissed the applicants’ complaint against the public prosecutor’s decision not to prosecute."
    note: "Terminal event of the single chain (1 -> 3),
      so the only final_domestic_decision. The court found that Officer Brons
      had acted in legitimate self-defence, endorsed the judge delegate's
      refusal to sit in public, agreed that a reconstruction would have been
      desirable but found the evidence conscientiously investigated, and held
      that the refusal of access to documents made no difference. The judgment
      records nothing after this date, so this is where the domestic history
      ends."


subject_matter:
  - "the refusal to prosecute the police officer who shot the applicants' grandson and son"
  - "the applicants' Article 12 complaint against that refusal, and the conduct of those proceedings"
