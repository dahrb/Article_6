    matter: Charge
    quote: "On 11 September 1998 the public prosecutor wrote to the parents of Moravia Ramsahai informing them that she had come to the conclusion that the shooting had been an act of self-defence and had therefore decided not to bring a prosecution against Officer Brons."
    note: "The decision not to prosecute, taken by Public Prosecutor De Vries
      -- the same prosecutor who had been in charge of criminal investigation
      work at Officer Brons's own police station, which the applicants relied
      on. `matter: Charge`: the decision is about whether Officer Brons would
      be charged. Head of the file: the investigation it closed is in section
      A and out of scope, hence `follows: null`."

