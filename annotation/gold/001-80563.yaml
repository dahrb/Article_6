    matter: Charge
    quote: "On 2 October 1998 they applied for such an order to the Amsterdam Court of Appeal ( gerechtshof ) by means of a complaint about the failure to bring a prosecution (Article 12 of the Code of Criminal Procedure ( Wetboek van Strafvordering ) – see below)."
    note: "HEAD OF THE ARTICLE 12 PROCEEDING -- the complaint against the
      failure to prosecute, and the only judicial stage in the case. Ids 5,
      6, 8, 9 and 10 are its acts. Level FirstInstance because this was the
      first and only court to determine the matter, notwithstanding the body's
      name; Appeal, or CaseReview under §6.1, are the readings to weigh
      against that. `follows: 1`, the non-prosecution decision complained of.
      The applicants' grounds are set out at length in this paragraph and are,
      in substance, the Article 2 procedural complaint later made at
      Strasbourg."

