    note: "Filing half of a §3.1 pair; the judgment is id 2, part_of: 1. `follows:
      null`: the action attacked the practice of Roma-only classes in general
      rather than any one of the administrative decisions recorded above, so there
      is no `follows` the text supports (§5.4 -- record only a link the text
      gives). proceeding_type Administrative because the action was brought under
      the Administrative Disputes Act. `matter: Other` -- segregated schooling is
      an identifiable substantive matter §6.7 does not name; it is not Property,
      Employment or any of the rest. 'the applicants' is one party entry with
      natural_person false: the text never separates them in this proceeding, and
      §5.3 is strict that a node standing for several people is not a natural
      person. The psychological study produced with the action is evidence, not an
      event."

