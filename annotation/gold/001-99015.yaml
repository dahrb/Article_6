document_note: >
  THREE chains. (A) The criminal case against the applicant, ids 1-9, ending in the
  Federal Constitutional Court. (B) The prosecution of the two police officers,
  ids 10-11, arising from the same events and ending in convictions with cautions
  and suspended fines. (C) Official liability and legal aid, ids 12-16, still
  pending. Chains A and B both descend from id 2 -- D.'s order to question the
  applicant under threat -- which is the pivot of the whole case.

  Records are grouped BY CHAIN rather than in strict date order, so chain B opens
  at Jan 2003, earlier than the end of chain A. That predates this revision; guide
  §5.1 asks for chronological order, and re-sorting would interleave three chains
  and destroy the grouping the comments rely on. REVIEW.

  Two chains carry final_domestic_decision (ids 9, 11); chain C does not, because
  it is pending.

  SPLIT UNDER §3.1: three pairs are now two events each -- the appeal on points of
  law (6 -> 7), the constitutional complaint (8 -> 9) and the legal-aid application
  (12 -> 13). Note id 6, where start_date is DERIVED rather than stated: the text
  says only "the day following his conviction". Ids were renumbered and do NOT
  correspond to the pre-v1.1 numbering.

  ids 3 and 4 are the judgement call here: two rulings by one court on one day on
  two preliminary applications, recorded as separate events because each disposes of
  a distinct application and each matters legally. Fold them into id 5 if
  preliminary rulings are steps inside a trial.

  ¶63 onwards is comparative and international material -- the Inter-American Court,
  US "fruit of the poisonous tree" doctrine, the South African Supreme Court of
  Appeal in Mthembu -- all cited as authority and therefore excluded by guide §4.2.
