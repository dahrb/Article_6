  # ---- Chain A: the criminal case against the applicant ----
  - id: 1
    type: ProsecutorialReview
    body: "the police"
    authority_kind: Prosecutorial
    jurisdiction_state: "Germany"
    decision_date: "2002-09-30"
    level: Investigative
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Responding
        natural_person: true
    follows: null
    matter: Arrest
    quote: "That afternoon, he was arrested at Frankfurt am Main airport"
    note: "Arrest following surveillance of the ransom pick-up. Includes what
      followed in custody that same night and the next morning: in a note for
      the police file dated 1 October 2002, the deputy chief of the Frankfurt
      police, D., stated that he believed J.'s life was in great danger and had
      therefore ordered the applicant to be threatened by detective officer E.
      with considerable pain, under medical supervision, and had also ordered
      a “truth serum” obtained -- the act at the centre of the whole case,
      later held to be coercion (id 8) and to have tainted the confession
      (id 4). Not recorded as its own ProsecutorialReview: it is not a review
      or appeal within the prosecutor's office and disposes of nothing --
      D.'s conduct is a fact narrated about the custody following this arrest,
      not a distinct legal/administrative act, and its substance is preserved
      through what it produced (the exclusion ruling id 3, the coercion
      finding id 8, and the officers' prosecution id 9-10). The medical
      certificates of 4 and 7 Oct 2002 are likewise evidence, not events."

  - id: 2
    type: DomesticProceeding
    body: "the Frankfurt am Main Regional Court"
    authority_kind: Judicial
    jurisdiction_state: "Germany"
    decision_date: "2003-04-09"
    level: FirstInstance
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
      - name: "the public prosecutor"
        side: Responding
        natural_person: false
    follows: 1
    matter: Requests
    quote: "On 9 April 2003, in response to the first preliminary application, the Frankfurt am Main Regional Court dismissed the applicant’s application for the discontinuation of the criminal proceedings."
    note: "First of TWO rulings by the same court on the same day on two separate
      preliminary applications (ids 2 and 3). Both are recorded because each disposes
      of a distinct application and each is legally consequential -- this one refused
      to stop the prosecution, and its refusal is what the applicant appealed at
      id 5. `matter: Requests`: an application to discontinue goes to the conduct of
      the proceeding, not to the substance of the charge itself."

  - id: 3
    type: DomesticProceeding
    body: "the Frankfurt am Main Regional Court"
