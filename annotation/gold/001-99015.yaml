subject_matter:
  - "a murder and kidnapping conviction resting in part on evidence obtained after the applicant was threatened with torture during interrogation"
  - "the criminal prosecution of the police officers responsible for the threat"
  - "legal aid for official-liability proceedings seeking compensation over the ill-treatment"
