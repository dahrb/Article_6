      detective officer E. had used prohibited methods under Article 136a § 1. The
      only decision in the applicant's favour in this chain. The quote is truncated
      mid-sentence in the source paragraph as supplied. `matter: Requests`: an
      evidence-exclusion motion goes to the fairness of the proceeding, not to the
      substance of the charge."

  - id: 4
    type: DomesticProceeding
    body: "the Frankfurt am Main Regional Court"
