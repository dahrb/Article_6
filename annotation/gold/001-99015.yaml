    note: "Filing half of a §3.1 pair; the dismissal is id 6. start_date is DERIVED,
      not stated: the text says only “the day following his conviction”, and the
      conviction (id 4) is 28 Jul 2003. Multiple antecedents (guide §5.4): ¶37 has
      the appeal complaining specifically about the Regional Court's decision of
      9 April 2003 -- both its refusal to discontinue the proceedings (id 2) and
