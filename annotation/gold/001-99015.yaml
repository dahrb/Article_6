    follows: [2, 3]
    matter: Conviction
    quote: "On 28 July 2003 the Frankfurt am Main Regional Court convicted the applicant, inter alia , of murder and kidnapping with extortion causing the death of the victim."
    note: "Life imprisonment, with a declaration of particular gravity of guilt
      bearing on later release on probation. The trial itself, following the two
      preliminary rulings (ids 2 and 3) -- both had to be disposed of before the
      trial reached a verdict, so this decision has two procedural antecedents
      (guide §5.4), not one."

