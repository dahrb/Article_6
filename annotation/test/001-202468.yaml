    quote: "On 22 August 2016 the applicant couple, accompanied by one of their children, travelled to the Belgian embassy in Beirut to submit visa applications for themselves and their two children."
    note: "Filing half of a §3.1 pair; the refusal is id 2. `natural_person: false`
      throughout this file: “the applicants” is a married couple and their two
      minor children, and §5.3 is strict that a node standing for several people is
      not a natural person -- this case is the schema's own example. The text never
      separates them, so one entry. jurisdiction_state is BELGIUM even though the
      embassy sits in Lebanon: §5.2 asks whose legal order the authority belongs
      to. `body` is the embassy because that is where ¶9 says the applications were
      submitted; ¶44 makes clear embassies cannot refuse a visa, and id 2 names the
      body that actually decided."

