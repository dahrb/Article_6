    note: "The measure the whole case is about. Taken in the applicant's absence; he
      was told about it on 22 April 2013 (¶10), five days later. His letter of
      5 March 2013 setting out his defence (¶8) is a submission inside this
      proceeding, not an event of its own. DROPPED the applicant's exclusion from
      the HQDCB's 19 April 2013 meeting (formerly id 3, borderline) as a
      consequence rather than a decision: the sentence is passive and names no
      body as having excluded him. Background only: it kept him out of the very
      body his October 2012 election had placed him on, two days after this
      suspension took effect."

