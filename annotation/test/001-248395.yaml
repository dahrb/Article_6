    authority_kind: Disciplinary
    jurisdiction_state: "Ukraine"
    decision_date: "2013-01-24"
    level: AdministrativeReview
    proceeding_type: Disciplinary
    outcome: Other
    outcome_direction: Unknown
    parties:
      - name: "the applicant"
        side: Responding
        natural_person: true
      - name: "Lawyer D."
        side: Initiating
        natural_person: true
    follows: null
    quote: "On 24 January 2013 the head of the HQDCB transferred D.’s complaint to the Qualification and Disciplinary Commission of the Regional Bar of Zakarpattya (“the QDC of Zakarpattya”)."
    note: "A jurisdiction transfer, so outcome Other and outcome_direction Unknown: a
      procedural routing decision disposes of nothing and does not cut for or
      against a party on the face of the text, however hard the applicant later
      fought it. Ids 10 and 12 get the same treatment. `follows` is
      null because D.'s complaint -- the act this responds to -- carries NO DATE
      anywhere in the judgment (¶5 says a copy is not even available to the Court),
      so it cannot be recorded as an event (§3.1). DROPPED the applicant's 12
      October 2012 election by the Sevastopol Bar to the HQDCB (formerly id 1,
      borderline): an election by fellow bar members is not a decision about the
      applicant, the same treatment given elsewhere to the HQDCB meeting of
      7 December 2012, also not recorded as an event for the same reason.
      Background only: per ¶6, Article 33 § 3 of the Law on the Bar required a
      complaint against an advocate elected to a self-government body to be
      examined by a regional Bar OUTSIDE the region where he was elected -- the
      election is why that rule reached him at all, and so why the transfer
      recorded here happened."

