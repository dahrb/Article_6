    borderline: true
    borderline_reason: "a private agreement between the applicant and his employer,
      concluded outside any court -- §4.4 names signed private agreements as the
      hard case, and no authority decided anything here, so it arguably types as
      none of the four echr:DomesticEvent subclasses and is not an event at all"
    quote: "Under the terms of an agreement concluded on 20 June 1995 with the first applicant, terminating his contract of employment on 30 June 1995, the company T. undertook to pay to the first applicant the sum of DEM 14,000 for lawyer’s fees incurred in labour court proceedings concerning his dismissal and DEM 305,000 for the loss of his job."
    note: "Recorded under §4.4's “always record it, and mark it”, against §4's “if it
      is none of the four, it is not an event”. The two rules genuinely pull in
      opposite directions here; the flag is what makes the call visible. `body` and
      `authority_kind` are the weakest part of the record -- the company is the
      counterparty, not a deciding authority, so authority_kind is Unknown rather
      than a value that would assert something false. The first applicant's own
      labour court proceedings against T., which this agreement mentions, are
      reported without any date and so cannot be recorded (§3.1). `Damages` added
      alongside `Employment`: the agreement fixes two specific figures (DEM 14,000
      fees, DEM 305,000 for loss of job), same as id 3."
