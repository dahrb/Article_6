document_note: >
  A war crimes prosecution under the War Crimes Act 1991, tried in 1999 for
  murders committed in Domachevo in 1942. ONE chain: investigation, trial,
  appeal, refusal of leave, with a four-day bail episode inside the trial. ONE
  final_domestic_decision, on id 7.

  THIS DOCUMENT IS DOMINATED BY UNDATED ACTS, and that is the main thing to check
  in it. A decision text is more compressed than a judgment, and it narrates
  several genuinely significant procedural acts without ever dating them. Every
  one of the following is described, mattered, and CANNOT be recorded, because
  §3.1 requires an event to be placeable in time and §4.5 forbids inferring what
  the text does no

  t state:

  - THE INDICTMENT on four counts of murder. §4 names a bill of indictment as an
    event in so many words, and this one is set out count by count -- but the text
    never says when he was charged.
  - THE ACQUITTAL ON COUNTS 2 AND 4, directed by the judge at the close of the
    prosecution case. A substantive disposal of half the indictment, dated only as
    "At the close of the prosecution case". It survives in this file only as the
    Mixed direction on id 5.
  - THE ABUSE-OF-PROCESS APPLICATION to stay the trial for lapse of time, and its
    refusal. The central fair-trial issue in the case, dated only as "Before the
    commencement of the proceedings".
  - THE APPEAL to the Court of Appeal and the PETITION for leave to the House of
    Lords. Both undated, so ids 6 and 7 have no §3.1 filing halves.
  - THE LORD CHIEF JUSTICE'S TARIFF RECOMMENDATION of five years, and the Home
    Secretary's fixing of the tariff, which "has yet to" happen. The first is
    undated; the second had not occurred, and a pending matter with no start date
    cannot be recorded either.

  DELIBERATELY NOT RECORDED although dated: the evidentiary rulings of 8 and
  26 February 1999 admitting the evidence of Ivan Baglay and Evgeny Melianuk, and
  the refusal of 24 March 1999 to let the prosecution prove the provenance of the
  missing persons document. All three are rulings inside the trial at id 5, and
  §3 treats what happens inside a proceeding as steps, not events. The bail
  rulings at ids 2-4 are recorded despite being equally interlocutory, because
  §4 singles out anything that authorised or ended a deprivation of liberty. A
  reviewer who finds that line too fine has two consistent alternatives: record
  the evidentiary rulings too, or drop ids 2-4 into id 5's note.

  Also not recorded: the judge and jury's site visit to Domachevo, and the
  judge's direction to the jury about hearsay. Steps inside the trial.

  OUT OF SCOPE: the historical narrative of the German occupation and the
  September 1942 massacre. Those are the FACTS THE OFFENCES CONSIST OF, not
  procedural history -- no domestic authority acted in them. Also out of scope:
  the War Crimes Act 1991 (§2, statutes) and the Court of Appeal's long summaries
  of the prosecution evidence at ¶50-51, which are evidence rather than events.
  The source text refers to a "Relevant Domestic Law and Practice" section that
  the extracted text does not contain.
