proceedings:

  - id: 1
    type: AdministrativeAction
    body: "the British police"
    authority_kind: Prosecutorial
    jurisdiction_state: "the United Kingdom"
    start_date: "1996-04-01"
    level: Investigative
    proceeding_type: Criminal
    outcome: Unknown
    outcome_direction: Unknown
    parties:
      - name: "the applicant"
        side: Responding
        natural_person: true
    follows: null
    matter: Investigation
    quote: "On 1 and 3 April 1996, the applicant was interviewed by the British police concerning his activities in Domachevo during the German occupation."
    note: "The only event representing the investigation stage, and recorded for
      that reason: the denials the applicant made here are what the prosecution
      later used against him. TWO dates in one sentence -- 1 and 3 April 1996 --
      and start_date takes the first; the record stands for both interviews, since
      the text treats them as one exercise. A reviewer who reads interviews as
      steps should delete this."

  - id: 2
    type: DomesticProceeding
    body: "the judge"
    authority_kind: Judicial
    jurisdiction_state: "the United Kingdom"
    decision_date: "1999-03-25"
    level: FirstInstance
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Responding
        natural_person: true
    follows: null
    occurs_during: 5
    matter: Bail
    quote: "On 25 March 1999, before the closing speeches were due to begin and a long adjournment over a weekend, the judge after consulting counsel decided to withdraw the applicant’s bail."
    note: "Recorded because §4 says in terms to record what “authorised or ended a
      deprivation of liberty”; the applicant spent the weekend in Belmarsh. This is
      an INTERLOCUTORY ruling inside the trial at id 5. `follows` is left null: it
      encodes procedural antecedence (an appeal follows the decision it appeals),
      and this isn't that -- id 5 didn't happen before this event, id 5 CONTAINS
      it. `occurs_during: 5` records that instead. EXPERIMENTAL FIELD, not yet in
      the ontology or guide -- see prompt_tweaks.md. Unfavourable despite the
      judge's stated reason being the applicant's own protection."

  - id: 3
    type: DomesticProceeding
    body: "the High Court"
    authority_kind: Judicial
    jurisdiction_state: "the United Kingdom"
    start_date: "1999-03-26"
    level: Appeal
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: UnfavourableToApplicant
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
    follows: 2
    occurs_during: 5
    matter: Bail
    quote: "An application was made to the High Court to review bail on 26 March 1999. It was refused."
    note: "NO §3.1 split and no decision_date: the application is dated and the
      refusal that follows it in the next sentence is not, so there is only one
      datable act. Kept as a single record with the real outcome, since the refusal
      is narrated in the same breath. The applicant says the judge declined to
      interfere given the stage the trial had reached. `occurs_during: 5` alongside
      `follows: 2`: this is still a step of the same bail episode nested inside the
      trial (26 March, within the 8 Feb-1 Apr span) -- follows records the true
      procedural antecedent (the withdrawal being reviewed), occurs_during records
      the containment, and nothing stops an event asserting both."

  - id: 4
    type: DomesticProceeding
    body: "the trial judge"
    authority_kind: Judicial
    jurisdiction_state: "the United Kingdom"
    decision_date: "1999-03-29"
    level: FirstInstance
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: FavourableToApplicant
    parties:
      - name: "the applicant"
        side: Initiating
        natural_person: true
    follows: 3
    occurs_during: 5
    matter: Bail
    quote: "On hearing re-assurances from defence counsel that arrangements would be made for transporting the applicant to and from the court room and for ensuring his welfare in his own home, and having regard to the shortness of the overnight adjournment of the trial, the trial judge reinstated bail."
    note: "Ends the deprivation of liberty begun at id 2, four days later. The quote
      is the sentence that evidences the reinstatement; the date comes from the
      first sentence of the same paragraph, which records the defence
      representations of 29 March 1999 that produced it. `occurs_during: 5` for
      the same reason as ids 2-3: 29 March falls inside the trial's 8 Feb-1 Apr
      span, and this ruling ends the bail episode that ran nested inside it."

  - id: 5
    type: DomesticProceeding
    body: "Mr Justice Potts and a jury"
    authority_kind: Judicial
    jurisdiction_state: "the United Kingdom"
    start_date: "1999-02-08"
    decision_date: "1999-04-01"
    level: FirstInstance
    proceeding_type: Criminal
    outcome: MeritsDecided
    outcome_direction: Mixed
    parties:
      - name: "the applicant"
        side: Responding
        natural_person: true
    follows: 1
    matter: Conviction
    quote: "On 1 April 1999, the jury convicted the applicant of counts 1 and 3."
    note: "KEEPS BOTH DATES and is not split under §3.1: the trial's opening is
      reported (“In the trial which took place between 8 February and 1 April
      1999”) rather than narrated as an act of institution, so there is no second
      sentence to quote -- exactly the §3.1 exception. start_date is therefore
      unsupported by the quote, which §3.1 says is what happens to one date in a
      folded record. Direction MIXED: the judge acquitted on counts 2 and 4 at the
      close of the prosecution case and the jury convicted on counts 1 and 3. The
      acquittal is narrated but UNDATED (“At the close of the prosecution case”), so
      it cannot be its own event and lives only in this direction value. Ordered
      here, after ids 2-4, because §5.1 orders by decision_date and the bail rulings
      fell inside the trial -- ids 2-4 now record that containment directly via the
      experimental `occurs_during: 5` field, each on its own record rather than
      only at the head of the bail sub-chain."

