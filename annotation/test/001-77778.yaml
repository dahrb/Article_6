document_note: >
  Two chains that mirror each other and start from the same incident. (a) THE
  APPLICANT'S COMPLAINT against the police: ids 1, 2, 5, 7, with the internal
  reviews of the operation feeding into it at ids 4 and 6 -- the MIA's
  working-group appointment and the MIA's own finding, both submitted to the
  Public Prosecutor. It died at the prosecutor's
  desk in January 1997, twenty-one months after it was lodged, and the applicant
  did not take up subsidiary prosecution. (b) THE POLICE COMPLAINT against the
  applicant, on the same incident, lodged five days after his: ids 3, 8-22. It
  ran for six and a half years, produced a refusal to investigate, an appeal that
  reversed it, an acquittal, a remittal, a conviction on retrial and a costs
  order.

  TWO final_domestic_decision flags, one per chain -- ids 7 and 22. Chain (a)
  concluded on 17 January 1997, well before the application. Chain (b) concluded
  on 11 October 2001, when ¶50 says the proceedings were "finally concluded" --
  three years AFTER the application was lodged on 22 July 1998, when chain (b)
  was still at the investigation stage. Under §5.1's revised rule the flag marks
  each chain's own terminal decision regardless of that timing; whether id 22
  actually served exhaustion for the application as filed is a downstream date
  comparison, not something decided by withholding the flag. (Superseded: an
  earlier revision of this file left id 22 unflagged on the theory that a chain
  still pending when the application was lodged gets no flag at all -- that
  reading has been dropped because it discarded the fact of how chain (b)
  actually ended rather than just leaving the exhaustion question open.)

  DELIBERATELY NOT RECORDED:

  - The two-day police operation of 4 and 5 April 1995 and the two entries into
    the Pik Bar (¶10-11). A general operation against a criminal organisation,
    with no decision and no connection to the applicant beyond setting up his
    arrest. About thirty people were arrested and injured over the two days
    (¶15); none of that is this applicant's procedural history.
  - The Public Prosecutor's request of 14 July 1995 that the police identify and
    interview the officers, and her request of 15 June 1995 that the applicant's
    lawyer file a deposition, filed on 20 June 1995 (¶30-31). Evidence-gathering
    steps inside the consideration of the complaint at id 5, not decisions --
    the same treatment given to the prosecutor's document request in Stanev
    (001-108690).
  - The lawyer's enquiries about progress on 21 October 1996 and 6 January 1997
    (¶30). Correspondence, not acts of any authority. They matter to the
    length-of-investigation complaint but are not events.
  - The applicant's hospital admissions on 6 and 7 April 1995 and the x-ray of
    19 April 1995 (¶26-27). Medical treatment and evidence; no body decided
    anything.
  - The officers' testimony at ¶21-25 and the two versions of events at ¶13-20:
    evidence about id 1, not further events.

  OUT OF SCOPE: ¶1-8, the Commission and Court proceedings (§2). The source text
  stops at ¶50, so the RELEVANT DOMESTIC LAW section referred to at ¶36 ("see
  paragraphs 55 and 58 below") is not present in this file -- the cross-references
  point outside the text given to the pipeline.
