    body: the enforcement judge at the Brussels French-language TPI
    authority_kind: Judicial
    parties:
    - name: the applicants
      side: Initiating
    - name: the Belgian State
      side: Responding
    quote: On 15 December 2016 the applicants brought an action against the Belgian State before the enforcement
      judge at the Brussels French-language TPI, seeking to ensure that the payment order of 13 December
      2016 was executed.
    gold_id: 14
  decisions:
  - id: D20
    date: "2017-12-20"
    body: the enforcement judge at the Brussels French-language TPI
    authority_kind: Judicial
    level: FirstInstance
    outcome: Other
    direction: UnfavourableToApplicant
    parties:
    - name: the applicants
      side: Initiating
    - name: the Belgian State
      side: Responding
    quote: On 20 December 2017 the French-language enforcement judge, examining the action brought by
