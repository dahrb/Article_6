# Simplified gold for the 10-set, derived by hand from annotation/test (the
# original gold is untouched). One entry per set of proceedings, as the Court
# counts them in committee appendices: the act that opened it (`start`, a gold
# id, or null when the text never narrates it), the decisions at each level
# (`decisions`, gold ids), and `pending`. Gold events not listed are not events
# under the simplified model. Every choice is a draft by Claude (2026-11-22),
# for checking whether the model is viable -- not an annotation to report.
# The reason for each non-obvious drop is in the comment.
# 2026-11-23, guide v3: unchallenged administrative measures dropped (Stanev P2,
# Klimentyev P2, Erol Aksoy P1); `enforces` added to enforcement sets. Set ids
# are kept as they were, so gaps in the numbering are deliberate.

001-108690:  # Stanev v. Bulgaria
  - {id: P1, kind: civil, label: "proceedings declaring the applicant partially incapacitated", start: 1, decisions: [2, 3]}
  # guide v3: 4, 5, 9 (guardian appointed, placement, new guardian) are measures
  # nobody asked for and nobody challenged as such -> not events (the
  # challenges are P3 and P4); 6, 7: execution steps
  - {id: P3, kind: other, label: "request to the prosecutor to seek restoration of legal capacity", start: 8, decisions: [11, 16, 17]}
  - {id: P4, kind: administrative, label: "request to the mayor, then judicial review of the refusal", start: 12, decisions: [14, 18]}
    # 15 (application for judicial review): a filing inside the set
  - {id: P5, kind: administrative, label: "request for a social allowance", start: 10, decisions: [22]}
    # 23 (allowance later increased): not a ruling on the request
  # dropped: 13 (request to Rila council, never decided); 19-21 (police search
  # and return to the home): facts, not proceedings

001-188177:  # Baduashvili v. Georgia
  - {id: P1, kind: criminal, label: "criminal proceedings against the applicant", start: 3, decisions: [11, 14, 15]}
    # start = arrest and remand (criminal "charge"); 1, 2, 4 (seizure, search
    # warrant, inspection) and 5-10 (requests inside the investigation): steps,
    # not decisions on the charge; 12, 13: convictions of OTHER people; 18 release
  - {id: P2, kind: criminal, label: "complaint of ill-treatment to the Chief Prosecutor", start: 16, decisions: [17]}

