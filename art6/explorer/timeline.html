<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domestic proceedings · interactive timeline</title>
<style>
* {
  box-sizing: border-box
}

body {
  margin: 0;
  background: #fff;
  color: #243449;
  font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
}

button,
select {
  font: inherit;
  color: inherit
}

button,
select {
  border: 1px solid #d7dfe6;
  border-radius: 6px;
  background: #fff;
  padding: 7px 10px
}

button {
  cursor: pointer
}

button:hover {
  background: #eef4f6;
  border-color: #93acb7
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid #0f766e;
  outline-offset: 2px
}

.viewer {
  border: 1px solid #dbe3e9;
  border-radius: 10px;
  overflow: hidden;
  background: white
}

.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-bottom: 1px solid #e3e8ed;
  background: #fff
}

.toolbar strong {
  font-size: 15px;
  margin-right: auto
}

.toolbar label {
  font-size: 12px;
  color: #617184
}

.toolbar select {
  max-width: 250px
}

.zoom {
  display: flex;
  align-items: center;
  gap: 5px
}

.zoom button {
  min-width: 32px
}

.zoom output {
  font-size: 12px;
  color: #526276;
  min-width: 38px;
  text-align: center
}

.legend {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 9px 16px;
  background: #f8fafb;
  border-bottom: 1px solid #e3e8ed;
  font-size: 11px;
  color: #526276
}

.legend span {
  white-space: nowrap
}

.line {
  display: inline-block;
  width: 26px;
  border-top: 2px solid #6f8093;
  vertical-align: middle;
  margin-right: 5px
}

.line.part {
  border-color: #20858d;
  border-top-style: dashed
}

.line.during {
  border-color: #a87b35;
  border-top-style: dotted
}

.positive {
  color: #16724f
}

.negative {
  color: #b34642
}

.mixed {
  color: #986b13
}

.workspace {
  display: flex;
  height: 558px;
  position: relative
}

.diagram {
  position: relative;
  min-width: 0;
  min-height: 0;
  flex: 1;
  background: #fbfcfd
}

.viewport {
  height: 100%;
  width: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-color: #bdcbd5 #f3f6f8;
  cursor: grab
}

.viewport.dragging {
  cursor: grabbing
}

.viewport svg {
  display: block;
  max-width: none
}

.lane-labels {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 16px;
  width: 170px;
  overflow: hidden;
  pointer-events: none;
  border-right: 1px solid #dce4ea;
  background: #f7f9fb;
  z-index: 2
}

.lane-label {
  position: absolute;
  width: 100%;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-bottom: 1px solid #e4eaef;
  overflow: hidden
}

.lane-label small {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #738295;
  margin-bottom: 7px
}

.lane-label b {
  font-size: 12px;
  line-height: 1.5;
  font-weight: 600
}

.lane-label span {
  font-size: 11px;
  color: #7a8796;
  margin-top: 8px
}

.inspector {
  width: 310px;
  flex-shrink: 0;
  overflow-wrap: anywhere;
  border-left: 1px solid #dce4ea;
  background: #fff;
  overflow: auto;
  padding: 18px;
  font-size: 13px;
  line-height: 1.6
}

.inspector[hidden] {
  display: none
}

.inspector .close {
  float: right;
  padding: 2px 9px;
  font-size: 19px
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: #728195;
  font-weight: 600
}

.inspector h2 {
  font-size: 18px;
  line-height: 1.4;
  margin: 10px 0
}

.inspector h3 {
  font-size: 11px;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: #6b7c8e;
  margin: 22px 0 8px
}

.inspector p {
  margin: 7px 0
}

.inspector blockquote {
  margin: 8px 0;
  padding: 10px 12px;
  border-left: 3px solid #3d918a;
  background: #f4f8f8;
  color: #435569;
  font-size: 12px
}

.inspector .fact {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 1px solid #edf1f4;
  padding: 6px 0
}

.fact span:first-child {
  color: #7a8796
}

.fact span:last-child {
  text-align: right
}

.inspector pre {
  white-space: pre-wrap;
  font: 11px ui-monospace, monospace;
  max-height: 200px;
  overflow: auto
}

.connection {
  display: block;
  text-align: left;
  width: 100%;
  margin: 6px 0;
  font-size: 12px;
  padding: 9px 10px
}

.connection small {
  display: block;
  color: #748396;
  font-size: 11px
}

.connection:disabled {
  cursor: default;
  opacity: .6
}

.event-nav {
  display: flex;
  gap: 8px;
  margin: 14px 0;
}

.event-nav button {
  flex: 1;
  font-size: 11px;
}

.event-nav button:disabled {
  opacity: .45;
  cursor: default;
}

.minimap:focus-visible {
  outline: 2px solid #16786f;
  outline-offset: 2px;
}

.empty-evidence {
  color: #7b8795;
  font-style: italic
}

.mapbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-top: 1px solid #dce4ea;
  background: #fff;
  height: 76px
}

.mapbar .map-caption {
  width: 115px;
  flex-shrink: 0;
  font-size: 10px;
  color: #738295;
  line-height: 1.6
}

.mapbar b {
  display: block;
  font-size: 11px;
  color: #485d71
}

.minimap {
  flex: 1;
  min-width: 0;
  height: 56px;
  cursor: crosshair;
  background: #f8fafb;
  border: 1px solid #edf1f4;
  border-radius: 4px
}

.footer {
  padding: 9px 16px;
  display: flex;
  gap: 14px;
  justify-content: space-between;
  font-size: 11px;
  line-height: 1.5;
  color: #728195;
  border-top: 1px solid #edf1f4
}

.footer button {
  font-size: 11px;
  padding: 2px 8px;
  white-space: nowrap
}

@media(max-width:900px) {
  .workspace {
    flex-direction: column;
  }

  .inspector {
    width: 100%;
    height: 230px;
    border-left: 0;
    border-top: 1px solid #dce4ea;
    padding: 14px 18px;
  }

  .toolbar strong {
    width: 100%
  }

  .lane-labels {
    width: 145px
  }

  .legend {
    gap: 8px
  }
}

@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior: auto !important
  }
}

@media(max-width:520px) {
  .lane-labels {
    display: none !important;
  }
}

@media(min-width:901px) {
  .inspector {
    width: 350px;
  }
}

.panel-tabs {
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
  padding: 4px 0;
  display: flex;
  gap: 6px;
  margin: 12px 0;
}

.panel-tabs button[aria-pressed="true"] {
  background: #e4f2ec;
  border-color: #16724f;
  color: #12553e;
}

.source-scroll {
  max-height: 340px;
  overflow: auto;
  border: 1px solid #dce5e9;
  border-radius: 8px;
  padding: 12px;
  background: #fafcfb;
  line-height: 1.65;
  font-size: 13px;
  white-space: pre-wrap;
}

.source-scroll mark {
  background: #ffe59a;
  color: #273429;
  border-radius: 2px;
}

.source-note {
  font-size: 12px;
  color: #526575;
  line-height: 1.5;
}

.source-picker {
  width: 100%;
  margin: 8px 0;
}

.chain-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0;
}

.lane-label b {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.lane-label .track-summary {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 11px;
  line-height: 1.45;
  margin-top: 8px;
  color: #526575;
}

@media(max-width:900px) {
  .source-scroll {
    max-height: 150px;
  }
}
</style>
</head>
<body>
<div class="viewer">
 <div class="toolbar">
  <strong>Procedural timeline</strong>
  <label for="track">Track</label><select id="track" aria-label="Focus a procedural track"><option value="all">All tracks</option></select>
  <div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Zoom in">+</button></div>
  <button id="read" title="Return to readable card size">Read</button><button id="fit" title="See all events at once">Overview</button>
 </div>
 <div class="legend" aria-label="Diagram key">
  <span><i class="line"></i>Follows</span><span><i class="line part"></i>Part of</span><span><i class="line during"></i>Occurs during</span>
  <span class="positive">▲ Favourable</span><span class="negative">▼ Unfavourable</span><span class="mixed">◆ Mixed</span><span>Outcome direction is relative to the applicant</span>
 </div>
 <div class="workspace">
  <div class="diagram"><div class="viewport" id="viewport" tabindex="0" aria-label="Procedural diagram. Scroll or drag to explore; select an event for its connections and evidence."><svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="Domestic procedural events"></svg></div><div class="lane-labels" id="lane-labels" aria-hidden="true"></div></div>
  <aside id="inspector" class="inspector" aria-label="Selected event details" hidden></aside>
 </div>
 <div class="mapbar"><div class="map-caption"><b>Case overview</b>Click or use arrow keys</div><svg id="minimap" class="minimap" xmlns="http://www.w3.org/2000/svg" aria-label="Case overview navigation. Arrow keys pan; Home returns to the beginning." role="group" tabindex="0"></svg></div>
 <div class="footer"><span id="status" aria-live="polite">Select an event to follow its connections.</span><button id="export">Download SVG</button></div>
</div>
<script>
'use strict';
const original = /*__SCENE__*/ ;
const NS = 'http://www.w3.org/2000/svg';
const graph = document.getElementById('graph'),
  viewport = document.getElementById('viewport'),
  inspector = document.getElementById('inspector'),
  map = document.getElementById('minimap'),
  labels = document.getElementById('lane-labels');
const byId = new Map(original.nodes.map(n => [n.id, n]));
const contextById = new Map(original.context.map(n => [n.id, n]));
const relation = {
  follows: ['Follows', '#6f8093', ''],
  part_of: ['Part of', '#20858d', '7 4'],
  occurs_during: ['Occurs during', '#a87b35', '2 4']
};
const inverse = {
  follows: 'Followed by',
  part_of: 'Contains',
  occurs_during: 'Contains occurrence'
};
let scene, scale = 1,
  selected = null,
  frame = null;

function svg(tag, attrs = {}, text = null, parent = graph) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text !== null) el.textContent = text;
  if (parent) parent.append(el);
  return el;
}

function html(tag, text = null, cls = '', parent = null) {
  const el = document.createElement(tag);
  if (text !== null) el.textContent = text;
  if (cls) el.className = cls;
  if (parent) parent.append(el);
  return el;
}

function lines(value, width, count) {
  const words = String(value || '').split(/\s+/).flatMap(word => {
    const letters = Array.from(word),
      chunks = [];
    for (let i = 0; i < letters.length; i += width) chunks.push(letters.slice(i, i + width)
      .join(''));
    return chunks;
  });
  let out = [],
    line = '';
  for (const word of words) {
    if ((line + ' ' + word).trim().length > width && line) {
      out.push(line);
      line = word;
    } else line = (line + ' ' + word).trim();
  }
  if (line) out.push(line);
  if (out.length > count) {
    out = out.slice(0, count);
    out[count - 1] = out[count - 1].slice(0, width - 1) + '…';
  }
  return out;
}

function fitText(element, maxWidth) {
  if (element.getComputedTextLength() <= maxWidth) return;
  const full = element.textContent,
    chars = Array.from(full);
  let low = 0,
    high = chars.length;
  while (low < high) {
    const middle = Math.ceil((low + high) / 2);
    element.textContent = chars.slice(0, middle).join('') + '…';
    if (element.getComputedTextLength() <= maxWidth) low = middle;
    else high = middle - 1;
  }
  element.textContent = chars.slice(0, low).join('') + '…';
  element.setAttribute('data-fulltext', full);
}

// Measure only on export, so long titles wrap without being cropped or omitted.
function exportLines(text, maxWidth, size, weight = 400) {
  const probe = svg('text', {
    'font-size': size,
    'font-weight': weight,
    visibility: 'hidden'
  });
  const width = value => {
    probe.textContent = value;
    return probe.getComputedTextLength();
  };
  const result = [];
  let line = '';
  for (let word of String(text).split(/\s+/)) {
    if (width((line + ' ' + word).trim()) <= maxWidth) {
      line = (line + ' ' + word).trim();
      continue;
    }
    if (line) {
      result.push(line);
      line = '';
    }
    while (width(word) > maxWidth) {
      const chars = Array.from(word);
      let low = 1,
        high = chars.length;
      while (low < high) {
        const mid = Math.ceil((low + high) / 2);
        if (width(chars.slice(0, mid).join('')) <= maxWidth) low = mid;
        else high = mid - 1;
      }
      result.push(chars.slice(0, low).join(''));
      word = chars.slice(low).join('');
    }
    line = word;
  }
  if (line) result.push(line);
  probe.remove();
  return result;
}

function multiline(parent, text, x, y, width, count, size, color, weight = 400) {
  lines(text, width, count).forEach((line, i) => svg('text', {
    x,
    y: y + i * (size + 4),
    'font-size': size,
    fill: color,
    'font-weight': weight
  }, line, parent));
}

function displayDate(n) {
  if (n.precision === 'undated') return n.date === 'Undated' ? 'Date not recorded' : n.date +
    ' · undated';
  if (n.date.length === 4) return n.date + ' · year only';
  if (n.date.length === 7) return n.date + ' · month only';
  return n.date;
}

function status(text) {
  document.getElementById('status').textContent = text;
}

let wholeChain = false,
  focusedChain = null,
  sourceTab = false;

function chainMembers(id, edges = original.edges) {
  const members = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const e of edges) {
      if (e.kind === 'occurs_during') continue;
      if (members.has(e.from) || members.has(e.to)) {
        for (const endpoint of [e.from, e.to]) {
          if (!members.has(endpoint)) {
            members.add(endpoint);
            changed = true;
          }
        }
      }
    }
  }
  return members;
}

function setScene(track = 'all', focus = null) {
  focusedChain = focus;
  const tracks = focus ? new Set(original.nodes.filter(n => focus.has(n.id)).map(n => n.track)) :
    null;
  const chosen = original.lanes.filter(l => (track === 'all' || l.id === track) && (!tracks ||
    tracks.has(l.id)));
  const offsets = new Map(chosen.map((l, i) => [l.id, 48 + i * original.laneHeight]));
  const nodes = original.nodes.filter(n => offsets.has(n.track)).map(n => ({
    ...n,
    y: offsets.get(n.track) + 46
  }));
  const ids = new Set(nodes.map(n => n.id));
  scene = {
    ...original,
    nodes,
    lanes: chosen.map(l => ({
      ...l,
      y: offsets.get(l.id)
    })),
    edges: original.edges.filter(e => ids.has(e.from) && ids.has(e.to)),
    height: Math.max(330, 48 + chosen.length * original.laneHeight),
    width: Math.max(700, ...nodes.map(n => n.x + original.cardWidth + 38))
  };
  selected = null;
  inspector.hidden = true;
  render();
  setScale(1, false);
  viewport.scrollTo(0, 0);
  status(
    `${nodes.length} events · ${scene.lanes.length} tracks · ${scene.edges.length} connections. Each track reads left to right; spacing is not elapsed time.`
  );
}

function render() {
  graph.replaceChildren();
  labels.replaceChildren();
  map.replaceChildren();
  graph.setAttribute('viewBox', `0 0 ${scene.width} ${scene.height}`);
  graph.setAttribute('font-family',
    'system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif');
  svg('title', {}, original.title);
  svg('desc', {},
    'Events are ordered within extracted tracks. Spacing is not elapsed time. Dates, instance levels, proceeding types and outcomes appear on each card.'
  );
  svg('style', {},
    `.event{cursor:pointer;outline:none}.event:focus-visible .card{stroke:#0f766e;stroke-width:3}.event.dim{opacity:.35}.edge.dim{opacity:.16}.event.selected .card{stroke:#0f766e;stroke-width:2.5}.event.related .card{stroke:#8aaeb0;stroke-width:2}.edge.active{stroke-width:2.6}.event:not(.selected):hover .card{stroke:#647f94;stroke-width:2}.event text{pointer-events:none}`
  );
  const defs = svg('defs');
  for (const [kind, style] of Object.entries(relation)) {
    const marker = svg('marker', {
      id: 'arrow-' + kind,
      viewBox: '0 0 10 10',
      refX: 9,
      refY: 5,
      markerWidth: 6,
      markerHeight: 6,
      orient: 'auto-start-reverse'
    }, null, defs);
    svg('path', {
      d: 'M 0 0 L 10 5 L 0 10 z',
      fill: style[1]
    }, null, marker);
  }
  svg('rect', {
    width: scene.width,
    height: scene.height,
    fill: '#fff'
  });
  svg('text', {
    x: scene.left,
    y: 24,
    'font-size': 11,
    fill: '#728195',
    'font-family': 'system-ui,sans-serif'
  }, 'PROCEDURAL SEQUENCE · Dates on cards; spacing is not elapsed time');
  for (const lane of scene.lanes) {
    svg('rect', {
      x: 0,
      y: lane.y,
      width: scene.width,
      height: original.laneHeight,
      fill: scene.lanes.indexOf(lane) % 2 ? '#ffffff' : '#f7f9fb'
    });
    svg('line', {
      x1: 0,
      x2: scene.width,
      y1: lane.y + original.laneHeight,
      y2: lane.y + original.laneHeight,
      stroke: '#e7edf2'
    });
    multiline(graph, lane.label, 16, lane.y + 76, 22, 5, 12, '#34495e', 600);
    const label = html('div', null, 'lane-label', labels);
    label.dataset.y = lane.y;
    html('small', `${lane.id} · Procedural track`, '', label);
    html('b', lane.label, '', label);
    html('span', `${lane.count} of ${lane.total} events`, '', label);
    const summary = lane.summary;
    html('div', summary.range, 'track-summary', label);
    html('div', summary.levels.join(' · ') || 'Levels not recorded', 'track-summary', label);
    html('div',
      `${summary.ambiguous ? 'Latest dated outcomes (order uncertain)' : 'Latest dated outcome'}: ${summary.latest}`,
      'track-summary', label);
    if (summary.undated) html('div',
      `${summary.undated} undated events${summary.undatedOutcomes ? ' · undated outcomes excluded' : ''}`,
      'track-summary', label);
  }
  const positions = new Map(scene.nodes.map(n => [n.id, n]));
  scene.edges.forEach((edge, i) => {
    const a = positions.get(edge.from),
      b = positions.get(edge.to),
      w = scene.cardWidth,
      h = scene.cardHeight;
    const x1 = a.x + w + 2,
      y1 = a.y + h / 2,
      x2 = b.x - 3,
      y2 = b.y + h / 2;
    const gap = 18 + (i % 3) * 5;
    let path;
    if (a.track === b.track && b.x - a.x === original.cardWidth + 60) {
      path = `M ${x1} ${y1} H ${x2}`;
    } else {
      const corridor = b.y - 36 - (i % 3) * 6;
      path = `M ${x1} ${y1} H ${x1+gap} V ${corridor} H ${x2-gap} V ${y2} H ${x2}`;
    }
    const style = relation[edge.kind];
    const p = svg('path', {
      d: path,
      fill: 'none',
      stroke: style[1],
      'stroke-width': 1.5,
      'stroke-dasharray': style[2],
      'marker-end': `url(#arrow-${edge.kind})`,
      class: 'edge',
      'data-from': edge.from,
      'data-to': edge.to
    });
    svg('title', {}, `${edge.to} ${style[0].toLowerCase()} ${edge.from}`, p);
  });
  for (const n of scene.nodes) {
    const g = svg('g', {
      transform: `translate(${n.x},${n.y})`,
      class: 'event',
      tabindex: 0,
      role: 'button',
      'aria-pressed': 'false',
      'data-id': n.id,
      'aria-label': `${n.id}, ${n.date}, ${n.court}, ${n.level}, ${n.type}, ${n.outcome}, ${n.direction}`
    });
    svg('title', {},
      `${displayDate(n)}\n${n.court}\n${n.description}\n${n.outcome} · ${n.direction}`, g);
    svg('text', {
      x: 0,
      y: -12,
      'font-size': 12,
      fill: '#506278',
      'font-weight': 500
    }, displayDate(n), g);
    svg('rect', {
      x: 0,
      y: 2,
      width: scene.cardWidth,
      height: scene.cardHeight,
      rx: 7,
      fill: '#24344908'
    }, null, g);
    svg('rect', {
      width: scene.cardWidth,
      height: scene.cardHeight,
      rx: 7,
      fill: '#fff',
      stroke: '#d8e1e8',
      'stroke-width': 1,
      class: 'card',
      'stroke-dasharray': n.significance === 'minor' ? '4 3' : ''
    }, null, g);
    svg('path', {
      d: `M 7 0 H ${scene.cardWidth-7} Q ${scene.cardWidth} 0 ${scene.cardWidth} 7 V 4 H 0 V 7 Q 0 0 7 0`,
      fill: n.level_style[2]
    }, null, g);
    svg('rect', {
      x: 12,
      y: 14,
      width: 28,
      height: 22,
      rx: 4,
      fill: n.level_style[2]
    }, null, g);
    svg('text', {
      x: 26,
      y: 29,
      'text-anchor': 'middle',
      'font-size': 11,
      'font-weight': 700,
      fill: 'white'
    }, n.level_style[0], g);
    svg('text', {
      x: 48,
      y: 29,
      'font-size': 11,
      'font-weight': 600,
      fill: n.level_style[2]
    }, n.level_style[1], g);
    multiline(g, n.court, 12, 57, 29, 2, 13, '#243449', 600);
    const kind = n.type === 'unknown' ? 'Type unspecified' : n.type.charAt(0).toUpperCase() + n.type
      .slice(1);
    svg('text', {
        x: 12,
        y: 96,
        'font-size': 10,
        fill: '#7b6898'
      },
      `${kind} · ${n.significance==='minor'?'Minor event':n.significance==='major'?'Major event':'Significance unspecified'}`,
      g);
    multiline(g, n.description || 'Description not provided', 12, 114, 36, 2, 10, '#6a7c8d');
    svg('line', {
      x1: 12,
      x2: scene.cardWidth - 12,
      y1: 142,
      y2: 142,
      stroke: '#edf1f4'
    }, null, g);
    svg('text', {
        x: 12,
        y: 158,
        'font-size': 11,
        fill: '#3e5268',
        'font-weight': 600
      }, n.outcome === 'unknown' ? 'Outcome not recorded' : n.outcome.charAt(0).toUpperCase() + n
      .outcome.slice(1), g);
    svg('text', {
      x: 12,
      y: 174,
      'font-size': 10,
      fill: n.direction_style[2]
    }, `${n.direction_style[0]} ${n.direction_style[1]}`, g);
    svg('text', {
      x: scene.cardWidth - 12,
      y: 158,
      'text-anchor': 'end',
      'font-size': 9,
      fill: '#92a0ad'
    }, n.id, g);
    for (const text of g.querySelectorAll('text')) {
      const x = Number(text.getAttribute('x')),
        y = Number(text.getAttribute('y'));
      const anchor = text.getAttribute('text-anchor');
      const maxWidth = anchor === 'middle' ? 28 : anchor === 'end' ? 32 : y === 158 ? scene
        .cardWidth - 64 : scene.cardWidth - x - (y < 0 ? 0 : 12);
      fitText(text, maxWidth);
    }
    g.addEventListener('click', () => select(n.id));
    g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        select(n.id);
      }
      if (e.key === 'Escape') clear();
      if (['ArrowRight', 'ArrowLeft'].includes(e.key)) {
        e.preventDefault();
        const same = scene.nodes.filter(x => x.track === n.track);
        const next = same[same.findIndex(x => x.id === n.id) + (e.key === 'ArrowRight' ? 1 : -
          1)];
        if (next) {
          select(next.id);
          focusNode(next.id);
        }
      }
    });
  }
  graph.setAttribute('font-family',
    'system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif');
  renderMap();
}

function renderMap() {
  map.setAttribute('viewBox', `0 0 ${scene.width} ${scene.height}`);
  map.setAttribute('preserveAspectRatio', 'none');
  for (const edge of scene.edges) {
    const a = scene.nodes.find(n => n.id === edge.from),
      b = scene.nodes.find(n => n.id === edge.to);
    svg('line', {
      x1: a.x + scene.cardWidth,
      y1: a.y + 92,
      x2: b.x,
      y2: b.y + 92,
      stroke: '#c0cbd5',
      'stroke-width': 7
    }, null, map);
  }
  for (const n of scene.nodes) svg('rect', {
    x: n.x,
    y: n.y,
    width: scene.cardWidth,
    height: scene.cardHeight,
    rx: 7,
    fill: n.level_style[2],
    opacity: .7
  }, null, map);
  svg('rect', {
    id: 'map-window',
    x: 0,
    y: 0,
    width: 100,
    height: 100,
    fill: '#0f766e16',
    stroke: '#0f766e',
    'stroke-width': 2,
    'vector-effect': 'non-scaling-stroke'
  }, null, map);
}

function refreshViewport() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = null;
    for (const label of labels.children) {
      label.style.top = (Number(label.dataset.y) * scale - viewport.scrollTop) + 'px';
      label.style.height = (original.laneHeight * scale) + 'px';
    }
    const win = document.getElementById('map-window');
    if (win) {
      win.setAttribute('x', viewport.scrollLeft / scale);
      win.setAttribute('y', viewport.scrollTop / scale);
      win.setAttribute('width', Math.min(scene.width, viewport.clientWidth / scale));
      win.setAttribute('height', Math.min(scene.height, viewport.clientHeight / scale));
    }
  });
}

function setScale(value, keepCenter = true) {
  const cx = (viewport.scrollLeft + viewport.clientWidth / 2) / scale,
    cy = (viewport.scrollTop + viewport.clientHeight / 2) / scale;
  scale = Math.min(1.5, Math.max(.1, value));
  graph.setAttribute('width', scene.width * scale);
  graph.setAttribute('height', scene.height * scale);
  document.getElementById('zoom-value').textContent = Math.round(scale * 100) + '%';
  labels.style.display = scale < .55 ? 'none' : 'block';
  labels.style.width = Math.min(170, scene.left * scale - 16) + 'px';
  if (keepCenter) viewport.scrollTo(cx * scale - viewport.clientWidth / 2, cy * scale - viewport
    .clientHeight / 2);
  refreshViewport();
}

function focusNode(id) {
  const n = scene.nodes.find(x => x.id === id);
  if (!n) return;
  const labelWidth = labels.clientWidth;
  const available = viewport.clientWidth - labelWidth - 24;
  if (scene.cardWidth * scale > available) setScale(available / scene.cardWidth, false);
  const topPadding = Math.min(80, Math.max(28 * scale, (viewport.clientHeight - scene.cardHeight *
    scale) / 2));
  viewport.scrollTo({
    left: Math.max(0, n.x * scale - labels.clientWidth - 16),
    top: Math.max(0, n.y * scale - topPadding),
    behavior: 'instant'
  });
  const element = Array.from(graph.querySelectorAll('.event')).find(e => e.dataset.id === id);
  if (element) element.focus({
    preventScroll: true
  });
}

function clear() {
  const previous = selected;
  if (focusedChain) setScene(document.getElementById('track').value);
  selected = null;
  inspector.hidden = true;
  graph.querySelectorAll('.event,.edge').forEach(e => e.classList.remove('dim', 'active',
    'selected', 'related'));
  graph.querySelectorAll('.event').forEach(el => el.setAttribute('aria-pressed', 'false'));
  const previousNode = Array.from(graph.querySelectorAll('.event')).find(el => el.dataset.id ===
    previous);
  if (previousNode) previousNode.focus({
    preventScroll: true
  });
  status(
    'Select an event to follow its connections. Dates are shown as recorded; spacing is not elapsed time.'
  );
  refreshViewport();
}

function select(id) {
  if (!scene.nodes.some(n => n.id === id)) {
    document.getElementById('track').value = 'all';
    setScene();
  }
  const n = byId.get(id);
  if (!n) return;
  const wasOverview = scale < .55;
  if (wasOverview) setScale(1, false);
  selected = id;
  const related = wholeChain ? chainMembers(id, scene.edges) : new Set([id]);
  for (const e of wholeChain ? [] : scene.edges)
    if (e.from === id || e.to === id) {
      related.add(e.from);
      related.add(e.to);
    }
  graph.querySelectorAll('.event').forEach(el => {
    el.classList.toggle('dim', !related.has(el.dataset.id));
    el.classList.toggle('selected', el.dataset.id === id);
    el.setAttribute('aria-pressed', String(el.dataset.id === id));
    el.classList.toggle('related', el.dataset.id !== id && related.has(el.dataset.id));
  });
  graph.querySelectorAll('.edge').forEach(el => {
    const active = wholeChain ? related.has(el.dataset.from) && related.has(el.dataset.to) : el
      .dataset.from === id || el.dataset.to === id;
    el.classList.toggle('dim', !active);
    el.classList.toggle('active', active);
  });
  inspector.replaceChildren();
  inspector.hidden = false;
  const close = html('button', '×', 'close', inspector);
  close.setAttribute('aria-label', 'Close event details');
  close.onclick = clear;
  html('div', `${n.id} · ${n.significance} event`, 'eyebrow', inspector);
  html('h2', n.court, '', inspector);
  const controls = html('div', null, 'chain-controls', inspector);
  const mode = html('button', wholeChain ? 'Whole chain ✓' : 'Highlight whole chain', '', controls);
  mode.setAttribute('aria-pressed', String(wholeChain));
  mode.onclick = () => {
    wholeChain = !wholeChain;
    if (!wholeChain && focusedChain) setScene(document.getElementById('track').value);
    select(id);
  };
  const focus = html('button', focusedChain ? 'Restore tracks' : 'Focus chain', '', controls);
  focus.onclick = () => {
    wholeChain = true;
    const members = focusedChain ? null : chainMembers(id);
    if (members) document.getElementById('track').value = 'all';
    setScene(document.getElementById('track').value, members);
    select(id);
    focusNode(id);
  };
  mode.title = focus.title =
    'Follow Follows and Part of links in both directions, including branches. Occurs during is contextual; event filters apply.';
  const tabs = html('div', null, 'panel-tabs', inspector);
  const detailButton = html('button', 'Event details', '', tabs);
  const sourceButton = html('button', 'Source text', '', tabs);
  const body = html('div', null, '', inspector);
  const sourceBody = html('div', null, '', inspector);

  function switchPanel(value) {
    sourceTab = value;
    body.hidden = value;
    sourceBody.hidden = !value;
    detailButton.setAttribute('aria-pressed', String(!value));
    sourceButton.setAttribute('aria-pressed', String(value));
    if (value) {
      showSource(n, sourceBody);
      if (window.innerWidth <= 900) requestAnimationFrame(() => {
        const passage = sourceBody.querySelector('.source-scroll');
        const target = passage || tabs;
        inspector.scrollTop += target.getBoundingClientRect().top - inspector
          .getBoundingClientRect().top - (passage ? tabs.offsetHeight + 12 : 0);
      });
    }
  }
  detailButton.onclick = () => switchPanel(false);
  sourceButton.onclick = () => switchPanel(true);
  switchPanel(sourceTab);
  const help = html('details', null, '', body);
  html('summary', 'How chain focus works', '', help);
  html('p', mode.title, 'source-note', help);
  const siblings = scene.nodes.filter(node => node.track === n.track),
    index = siblings.findIndex(node => node.id === id);
  const navigation = html('div', null, 'event-nav', body);
  for (const [label, offset] of [
      ['← Previous event', -1],
      ['Next event →', 1]
    ]) {
    const next = siblings[index + offset],
      button = html('button', label, '', navigation);
    button.disabled = !next;
    if (next) button.onclick = () => {
      select(next.id);
      focusNode(next.id);
    };
  }
  html('p', n.description || 'No description provided.', '', body);
  for (const [label, value] of [
      ['Date', displayDate(n)],
      ['Instance', n.level_style[1]],
      ['Type', n.type === 'unknown' ? 'Not recorded' : n.type.charAt(0).toUpperCase() + n.type
        .slice(1)
      ],
      ['Outcome', n.outcome === 'unknown' ? 'Not recorded' : n.outcome.charAt(0).toUpperCase() + n
        .outcome.slice(1)
      ],
      ['Direction', n.direction_style[1]]
    ]) {
    const fact = html('div', null, 'fact', body);
    html('span', label, '', fact);
    html('span', value, '', fact);
  }
  const trackDetails = html('details', null, '', body);
  html('summary', 'Track summary · current event filters', '', trackDetails);
  const lane = original.lanes.find(l => l.id === n.track),
    summary = lane.summary;
  html('p', `${lane.label} · ${lane.count} of ${lane.total} events`, '', trackDetails);
  html('p', `${summary.range} · ${summary.undated} undated`, '', trackDetails);
  html('p', `Recorded levels: ${summary.levels.join(' · ') || 'Not recorded'}`, '', trackDetails);
  html('p',
    `${summary.ambiguous ? 'Latest dated outcomes (order uncertain)' : 'Latest dated outcome'}: ${summary.latest}`,
    '', trackDetails);
  if (summary.undatedOutcomes) html('p',
    `${summary.undatedOutcomes} undated outcomes cannot be ordered.`, '', trackDetails);
  html('h3', 'Connections', '', body);
  let connections = 0;
  for (const [kind, style] of Object.entries(relation)) {
    const target = n.raw[kind];
    if (target) {
      connection(style[0], target);
      connections++;
    }
    for (const other of original.context)
      if (other.links[kind] === id) {
        connection(inverse[kind], other.id);
        connections++;
      }
  }
  if (!connections) html('p', 'No extracted connections.', 'empty-evidence', body);

  function connection(label, target) {
    const other = contextById.get(target),
      visible = byId.has(target);
    const button = html('button', `${label} → ${target}`, 'connection', body);
    html('small', other ?
      `${other.date} · ${other.court}${visible?'':' · Hidden by event filters'}` :
      'Endpoint missing from this extraction', '',
      button);
    button.disabled = !visible;
    if (visible) button.onclick = () => {
      select(target);
      focusNode(target);
    };
  }
  html('h3', 'Supporting quotation', '', body);
  if (n.quote) html('blockquote', n.quote, '', body);
  else html('p', 'No event quotation in this export.', 'empty-evidence', body);
  html('h3', 'Parties', '', body);
  html('p', (n.raw.parties || []).map(p => p.name_span?.text).filter(Boolean).join('; ') ||
    'Not recorded', '', body);
  const details = html('details', null, '', body);
  html('summary', 'All extracted fields', '', details);
  html('pre', JSON.stringify(n.raw, null, 2), '', details);
  inspector.scrollTop = 0;
  status(
    `${id} selected · ${related.size-1} ${wholeChain ? 'chain' : 'directly connected'} events highlighted · Escape to clear`
  );
  const placed = scene.nodes.find(node => node.id === id);
  if (wasOverview || placed.x * scale < viewport.scrollLeft + labels.clientWidth ||
    (placed.x + scene.cardWidth) * scale > viewport.scrollLeft + viewport.clientWidth ||
    (placed.y - 25) * scale < viewport.scrollTop ||
    (placed.y + scene.cardHeight) * scale > viewport.scrollTop + viewport.clientHeight) {
    focusNode(id);
  }
  refreshViewport();
}

function showSource(n, parent) {
  parent.replaceChildren();
  const doc = original.document;
  if (!doc?.text) {
    html('p', 'Source text is not packaged for this view.', 'source-note', parent);
    return;
  }
  html('h3', doc.label || 'Saved extraction input', '', parent);
  html('p',
    'Saved input may cover only part of the judgment. Highlights are exact source matches.',
    'source-note', parent);
  const spans = n.evidence || [];
  const verified = spans.filter(e => e.verified);
  const note = html('p', '', 'source-note', parent);
  const picker = html('select', null, 'source-picker', parent);
  picker.setAttribute('aria-label', 'Supporting source passage');
  for (const [i, item] of verified.entries()) {
    const option = html('option', item.label, '', picker);
    option.value = String(i);
  }
  picker.hidden = !verified.length;
  const content = html('div', null, 'source-scroll', parent);
  content.tabIndex = 0;
  content.setAttribute('aria-label', 'Saved source text');

  function highlight(index) {
    content.replaceChildren();
    const item = verified[index];
    note.textContent = item ?
      `${item.label} · verified exact source offsets ${item.start}–${item.end}${!spans.some(e => e.label === 'Event quotation' && e.verified) ? ' · No verified event quotation; showing another extracted field.' : ''}` :
      'No verified supporting span for this event. Source shown without a highlight.';
    // Python offsets count Unicode code points, not JavaScript UTF-16 units.
    const chars = Array.from(doc.text);
    if (!item) {
      content.textContent = doc.text;
      return;
    }
    content.append(document.createTextNode(chars.slice(0, item.start).join('')));
    const mark = html('mark', chars.slice(item.start, item.end).join(''), '', content);
    content.append(document.createTextNode(chars.slice(item.end).join('')));
    requestAnimationFrame(() => {
      content.scrollTop += mark.getBoundingClientRect().top - content.getBoundingClientRect()
        .top - 65;
    });
  }
  picker.onchange = () => highlight(Number(picker.value));
  highlight(0);
  if (spans.some(e => !e.verified)) html('p',
    'Some extracted spans could not be verified and are not highlighted.', 'source-note', parent);
  const provenance = html('details', null, '', parent);
  html('summary', 'Source provenance', '', provenance);
  html('p', doc.source, 'source-note', provenance);
  html('p', `Text SHA-256: ${doc.sha256}`, 'source-note', provenance);
}
for (const lane of original.lanes) {
  const opt = html('option', `${lane.id} · ${lane.label}`);
  opt.value = lane.id;
  document.getElementById('track').append(opt);
}
document.getElementById('track').onchange = e => setScene(e.target.value);
document.getElementById('zoom-in').onclick = () => setScale(scale * 1.2);
document.getElementById('zoom-out').onclick = () => setScale(scale / 1.2);
document.getElementById('read').onclick = () => {
  setScale(1);
  if (selected) focusNode(selected);
};
document.getElementById('fit').onclick = () => {
  setScale(Math.min(viewport.clientWidth / scene.width, viewport.clientHeight / scene.height),
    false);
  viewport.scrollTo(0, 0);
  status(
    'Case overview · Select an event to read it, or choose Read to return to full-size cards.');
};
viewport.addEventListener('scroll', refreshViewport, {
  passive: true
});
new ResizeObserver(refreshViewport).observe(viewport);
let drag = null;
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.event') || e.button !== 0) return;
  drag = {
    x: e.clientX,
    y: e.clientY,
    left: viewport.scrollLeft,
    top: viewport.scrollTop
  };
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove', e => {
  if (drag) viewport.scrollTo(drag.left + drag.x - e.clientX, drag.top + drag.y - e.clientY);
});
viewport.addEventListener('pointerup', () => {
  drag = null;
  viewport.classList.remove('dragging');
});
viewport.addEventListener('pointercancel', () => {
  drag = null;
  viewport.classList.remove('dragging');
});
map.addEventListener('click', e => {
  const box = map.getBoundingClientRect();
  viewport.scrollTo((e.clientX - box.left) / box.width * scene.width * scale - viewport
    .clientWidth / 2, (e.clientY - box.top) / box.height * scene.height * scale - viewport
    .clientHeight / 2);
});
map.addEventListener('keydown', e => {
  const moves = {
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0],
    ArrowUp: [0, -1],
    ArrowDown: [0, 1]
  };
  if (moves[e.key]) {
    e.preventDefault();
    const [x, y] = moves[e.key];
    viewport.scrollBy(x * viewport.clientWidth * .6, y * viewport.clientHeight * .6);
  }
  if (e.key === 'Home') {
    e.preventDefault();
    viewport.scrollTo(0, 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clear();
});
document.getElementById('export').onclick = () => {
  const clone = graph.cloneNode(true);
  clone.querySelector('style')?.remove();
  clone.setAttribute('width', scene.width);
  clone.setAttribute('height', scene.height);
  clone.querySelectorAll('.event,.edge').forEach(e => {
    e.classList.remove('dim', 'active', 'related', 'selected');
    e.removeAttribute('tabindex');
    e.removeAttribute('role');
    e.removeAttribute('aria-pressed');
  });
  const maxWidth = scene.width - 40;
  const titleLines = exportLines(original.title, maxWidth, 18, 600);
  const track = document.getElementById('track').value;
  const scope = focusedChain ? `Chain focus · ${scene.lanes.length} tracks` : track === 'all' ?
    'All tracks' : `Track ${track}`;
  const metadata = [original.caseId, original.sourceLabel, scope,
    `${scene.nodes.length} of ${original.context.length} events`
  ].filter(Boolean).join(' · ');
  const metadataLines = exportLines(metadata, maxWidth, 11);
  const noteLines = exportLines(
    'Dates retain recorded precision. Spacing shows sequence, not elapsed time.', maxWidth, 11);
  const headerHeight = 38 + titleLines.length * 24 + (metadataLines.length + noteLines.length) *
    16 + 28;
  const exported = document.createElementNS(NS, 'svg');
  exported.setAttribute('width', scene.width);
  exported.setAttribute('height', scene.height + headerHeight);
  exported.setAttribute('viewBox', `0 0 ${scene.width} ${scene.height + headerHeight}`);
  exported.setAttribute('font-family',
    'system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif');
  svg('rect', {
    width: scene.width,
    height: scene.height + headerHeight,
    fill: '#fff'
  }, null, exported);
  let y = 28;
  for (const line of titleLines) {
    svg('text', {
      x: 20,
      y,
      'font-size': 18,
      'font-weight': 600,
      fill: '#243449'
    }, line, exported);
    y += 24;
  }
  y += 2;
  for (const line of [...metadataLines, ...noteLines]) {
    svg('text', {
      x: 20,
      y,
      'font-size': 11,
      fill: '#6b7c8e'
    }, line, exported);
    y += 16;
  }
  y += 10;
  Object.values(relation).forEach((style, i) => {
    const x = 20 + i * 180;
    svg('line', {
      x1: x,
      x2: x + 30,
      y1: y,
      y2: y,
      stroke: style[1],
      'stroke-width': 2,
      'stroke-dasharray': style[2]
    }, null, exported);
    svg('text', {
      x: x + 40,
      y: y + 4,
      'font-size': 12,
      fill: '#526276'
    }, style[0], exported);
  });
  clone.setAttribute('y', headerHeight);
  exported.append(clone);
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(exported)], {
    type: 'image/svg+xml'
  }));
  const a = document.createElement('a');
  a.href = url;
  a.download = [original.caseId || 'domestic-proceedings', original.runId, track === 'all' ?
      'all-tracks' : track
    ]
    .filter(Boolean).map(value => value.replace(/[^a-zA-Z0-9_-]/g, '-')).join('-') + '.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
setScene();
</script>
</body>
</html>
