[project]
name = "art-6"
version = "0.1.0"
description = "Collection and processing pipeline for ECHR Art. 6 case metadata and text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "ipykernel>=7.2.0",
    "lxml>=5.3.0",
    "openai>=2.7.1",
    "pandas>=3.0.0",
    "polars>=1.40.1",
    "pycountry>=26.2.16",
    "pyshacl>=0.40.1",
    "rdflib>=7.5.4",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
]

# Dependencies of the archived ontology/old/ code, kept out of the default
# install:  uv sync --extra ontology
# Note: those scripts also import `ontocast`, which is not published and was
# previously wired to a local ../../ontocast checkout. Re-add it as a
# [tool.uv.sources] path entry if you resurrect that code.
[project.optional-dependencies]
ontology = [
    "matplotlib>=3.10.8",
    "owlready2>=0.50",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art6"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]
