[project]
name = "art-6"
version = "0.1.0"
description = "Extracting the domestic procedural history of ECtHR Article 6 judgments as RDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "ipykernel>=7.2.0",
    "lxml>=5.3.0",
    "openai>=2.7.1",
    "pandas>=3.0.0",
    "polars>=1.40.1",
    "pycountry>=26.2.16",
    "pyshacl>=0.40.1",
    "pyyaml>=6.0",
    "rdflib>=7.5.4",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# uv sync --extra viz
viz = [
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art6"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]
